<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cita confirmada | MX Business Card</title>
  <style>
    body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7fb;color:#101828}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #e2e7f0;border-radius:18px;padding:24px;box-shadow:0 12px 28px rgba(16,24,40,.09)}h1{margin:0 0 8px;font-size:28px}.muted{color:#667085}.details{margin:20px 0;padding:16px;background:#f8fafc;border-radius:12px}.details b,.details span{display:block}.details span{margin-top:4px}.actions{display:grid;gap:10px}.btn{display:block;text-align:center;text-decoration:none;border-radius:11px;padding:13px 16px;font-weight:700}.primary{background:#4f46e5;color:#fff}.secondary{background:#fff;color:#101828;border:1px solid #d0d5dd}.brand{text-align:center;margin-top:18px;font-size:12px;color:#667085}
  </style>
</head>
<body>
<div class="wrap"><main class="card">
  <h1>Tu cita está confirmada</h1>
  <p class="muted">Guárdala en tu calendario para tenerla a la mano.</p>
  <div class="details"><b id="title">Cita</b><span id="date"></span></div>
  <div class="actions"><a class="btn primary" id="google" target="_blank" rel="noopener">Agregar a Google Calendar</a><button class="btn secondary" id="ics" type="button">Agregar a iPhone / Apple Calendar</button></div>
  <div class="brand">MX Business Card</div>
</main></div>
<script>
const p=new URLSearchParams(location.search);const title=(p.get('title')||'Cita').slice(0,180);const start=new Date(p.get('start')||'');const duration=Math.max(5,Math.min(1440,Number(p.get('duration')||30)));const valid=!Number.isNaN(start.getTime());const end=new Date(start.getTime()+duration*60000);document.getElementById('title').textContent=title;document.getElementById('date').textContent=valid?new Intl.DateTimeFormat('es-MX',{dateStyle:'full',timeStyle:'short'}).format(start):'Fecha no disponible';const utc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');if(valid){const g=new URL('https://calendar.google.com/calendar/render');g.searchParams.set('action','TEMPLATE');g.searchParams.set('text',title);g.searchParams.set('dates',utc(start)+'/'+utc(end));g.searchParams.set('details','Cita confirmada desde MX Business Card');document.getElementById('google').href=g.toString();document.getElementById('ics').onclick=()=>{const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MX Business Card//Appointments//ES','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+crypto.randomUUID()+'@mxbusinesscard.com','DTSTAMP:'+utc(new Date()),'DTSTART:'+utc(start),'DTEND:'+utc(end),'SUMMARY:'+esc(title),'DESCRIPTION:'+esc('Cita confirmada desde MX Business Card'),'END:VEVENT','END:VCALENDAR'].join('\r\n');const blob=new Blob([body],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cita.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}}else{document.getElementById('google').removeAttribute('href');document.getElementById('ics').disabled=true}
</script>
</body>
</html>
