<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alta Asistida · MX Business Card</title><style>
:root{--p:#4f46e5;--bg:#f6f7fb;--line:#e2e7f0;--text:#101828;--muted:#667085;--ok:#15803d;--warn:#a16207}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}header{background:#0b1220;color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}main{width:min(1180px,92vw);margin:28px auto}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.step{padding:8px 11px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:800}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:82px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:white}.ghost{background:white;border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}.item:hover,.item.selected{border-color:var(--p);background:#f7f7ff}.item strong,.item small{display:block}.item small{color:var(--muted);margin-top:4px}.badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:800}.notice{padding:12px;border-radius:10px;background:#fffbeb;color:#854d0e;margin:12px 0}.success{background:#ecfdf3;color:#067647}.hidden{display:none}.cards{display:grid;gap:8px;margin:12px 0}.card{padding:10px;border:1px solid var(--line);border-radius:10px}.muted{color:var(--muted)}@media(max-width:800px){.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><b>MX Business Card · Alta Asistida</b><button class="ghost" onclick="location.href='/'">Volver al administrador</button></header><main><div id="login" class="panel"><h1>Acceso de plataforma</h1><p class="muted">Inicia sesión con tu cuenta de superadministrador.</p><form onsubmit="login(event)" class="formgrid"><div class="field"><label>Correo</label><input id="email" type="email" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" required></div><div class="full row"><button class="primary">Ingresar</button></div></form><p id="loginError" class="notice hidden"></p></div><div id="app" class="hidden"><div class="steps"><span class="step">1 · Alta</span><span class="step">2 · Preparación</span><span class="step">3 · Revisión</span><span class="step">4 · Entrega</span></div><div class="grid"><section><div class="panel"><div class="row" style="justify-content:space-between"><h2>Altas en proceso</h2><button class="ghost" onclick="loadList()">Actualizar</button></div><div id="list" class="list"></div></div><div class="panel"><h2>Nuevo cliente</h2><form onsubmit="createCustomer(event)"><div class="formgrid"><div class="field"><label>Nombre comercial *</label><input id="orgName" required></div><div class="field"><label>Correo del administrador *</label><input id="ownerEmail" type="email" required></div><div class="field"><label>Teléfono</label><input id="orgPhone"></div><div class="field"><label>Correo empresa</label><input id="orgEmail" type="email"></div><div class="field"><label>Plan *</label><select id="plan"><option value="70000000-0000-4000-8000-000000000001">Esencial</option><option value="70000000-0000-4000-8000-000000000002">Independiente</option><option value="70000000-0000-4000-8000-000000000003">PyME</option><option value="70000000-0000-4000-8000-000000000004">Empresarial</option></select></div><div class="field"><label>Tarjetas contratadas *</label><input id="contracted" type="number" min="1" value="1" required></div><div class="field full"><label>Notas</label><textarea id="notes"></textarea></div></div><button class="primary">Crear como Alta Asistida</button></form></div></section><section><div id="workspace" class="panel"><h2>Selecciona un cliente</h2><p class="muted">Aquí prepararás sus tarjetas antes de entregar el acceso.</p></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const URL='https://loovwrnifdimlwpfgjza.supabase.co',KEY='sb_publishable_eP8FFThBgpS4ox4tlP40Lg_8Y51C9sR',db=supabase.createClient(URL,KEY);let session=null,selected=null,rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=s=>String(s||'tarjeta').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,100);
async function call(body){const {data,error}=await db.functions.invoke('platform-assisted-onboarding',{body});if(error){let msg=error.message;try{const x=await error.context.json();msg=x.error||msg}catch{}throw new Error(msg)}if(!data?.ok)throw new Error(data?.error||'No se pudo completar la operación.');return data.data}
async function login(e){e.preventDefault();const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){loginError.textContent=r.error.message;loginError.classList.remove('hidden');return}session=r.data.session;showApp();await loadList()}
function showApp(){login.classList.add('hidden');app.classList.remove('hidden')}
async function loadList(){try{rows=await call({action:'list'});list.innerHTML=rows.length?rows.map(r=>`<div class="item ${selected?.organization_id===r.organization_id?'selected':''}" onclick="selectClient('${r.organization_id}')"><strong>${esc(r.organization_name)}</strong><small>${esc(r.owner_email)} · ${esc(r.plan_name)}</small><span class="badge">${label(r.onboarding_status)} · ${r.used_cards}/${r.contracted_cards} tarjetas</span></div>`).join(''):'<p class="muted">No hay altas asistidas todavía.</p>'}catch(e){list.innerHTML=`<p class="notice">${esc(e.message)}</p>`}}
function label(s){return {information_pending:'Información pendiente',configuring:'En configuración',ready_to_deliver:'Lista para entregar',access_delivered:'Acceso entregado',active:'Activa'}[s]||s}
async function createCustomer(e){e.preventDefault();try{const data=await call({action:'create_customer',organization_name:orgName.value.trim(),owner_email:ownerEmail.value.trim(),organization_email:orgEmail.value.trim()||null,phone:orgPhone.value.trim()||null,plan_id:plan.value,contracted_cards:Number(contracted.value),subscription_status:'active',renewal_type:'manual',notes:notes.value.trim()||null});await loadList();await selectClient(data.organization_id)}catch(err){alert(err.message)}}
async function selectClient(id){selected=rows.find(r=>r.organization_id===id)||null;if(!selected){await loadList();selected=rows.find(r=>r.organization_id===id)}await loadList();await renderWorkspace()}
async function renderWorkspace(){if(!selected)return;let cards=[];try{cards=await call({action:'list_cards',organization_id:selected.organization_id})}catch{}const locked=['access_delivered','active'].includes(selected.onboarding_status),ready=selected.onboarding_status==='ready_to_deliver';workspace.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>${esc(selected.organization_name)}</h2><p class="muted">${esc(selected.owner_email)} · ${esc(selected.plan_name)}</p></div><span class="badge">${label(selected.onboarding_status)}</span></div><div class="notice ${locked?'success':''}">${locked?'El acceso ya fue entregado.':ready?'Revisa la información. Cuando estés seguro, entrega el acceso.':'Captura las tarjetas contratadas. El cliente todavía no ha recibido acceso.'}</div><h3>Tarjetas preparadas (${cards.length}/${selected.contracted_cards})</h3><div class="cards">${cards.length?cards.map(c=>`<div class="card"><b>${esc(c.card_name)}</b><small class="muted"> /c/${esc(c.card_slug)} · ${esc(c.card_status)}</small></div>`).join(''):'<p class="muted">Todavía no has preparado tarjetas.</p>'}</div>${!locked&&cards.length<selected.contracted_cards?cardForm():''}<div class="row">${!locked&&!ready?`<button class="ghost" onclick="setReady()" ${cards.length?'':'disabled'}>Marcar lista para entregar</button>`:''}${ready?`<button class="primary" onclick="deliver()">Entregar acceso al cliente</button>`:''}</div>`}
function cardForm(){return `<form onsubmit="createCard(event)"><h3>Preparar tarjeta</h3><div class="formgrid"><div class="field"><label>Nombre *</label><input id="cardName" required oninput="if(!cardSlug.dataset.edited)cardSlug.value=slug(this.value)"></div><div class="field"><label>URL / slug *</label><input id="cardSlug" required oninput="this.dataset.edited='1'"></div><div class="field"><label>Puesto</label><input id="cardPosition"></div><div class="field"><label>Empresa</label><input id="cardCompany" value="${esc(selected.organization_name)}"></div><div class="field"><label>Teléfono</label><input id="cardPhone"></div><div class="field"><label>WhatsApp</label><input id="cardWa"></div><div class="field"><label>Correo</label><input id="cardEmail" type="email"></div><div class="field"><label>Sitio web</label><input id="cardWeb"></div><div class="field full"><label>Descripción</label><textarea id="cardDescription"></textarea></div></div><button class="primary">Guardar tarjeta en borrador</button></form>`}
async function createCard(e){e.preventDefault();try{await call({action:'create_card',organization_id:selected.organization_id,slug:slug(cardSlug.value),name:cardName.value.trim(),position:cardPosition.value.trim()||null,company:cardCompany.value.trim()||null,description:cardDescription.value.trim()||null,phone:cardPhone.value.trim()||null,whatsapp:cardWa.value.trim()||null,email:cardEmail.value.trim()||null,website:cardWeb.value.trim()||null});await loadList();selected=rows.find(r=>r.organization_id===selected.organization_id);await renderWorkspace()}catch(err){alert(err.message)}}
async function setReady(){if(!confirm('¿Marcar esta alta como lista para entregar?'))return;try{await call({action:'set_status',organization_id:selected.organization_id,status:'ready_to_deliver'});await loadList();selected=rows.find(r=>r.organization_id===selected.organization_id);await renderWorkspace()}catch(e){alert(e.message)}}
async function deliver(){if(!confirm('Esto enviará al cliente el correo para activar su acceso. ¿Continuar?'))return;try{await call({action:'deliver_access',organization_id:selected.organization_id});await loadList();selected=rows.find(r=>r.organization_id===selected.organization_id);await renderWorkspace();alert('Acceso enviado correctamente.')}catch(e){alert(e.message)}}
(async()=>{const r=await db.auth.getSession();session=r.data.session;if(session){showApp();await loadList()}})();
</script></body></html>
