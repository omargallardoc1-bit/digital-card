<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MX Business Card · Audio extendido</title>
<style>
:root{--nav:#0b1220;--primary:#4f46e5;--primary2:#4338ca;--bg:#f6f7fb;--card:#fff;--line:#e2e7f0;--text:#101828;--muted:#667085;--good:#15803d;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:40px;height:40px;border-radius:12px;background:var(--primary);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#98a2b3;font-size:11px;text-transform:uppercase}.navbtn,.ghost,.primary{min-height:42px;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}.navbtn{width:100%;text-align:left;border:1px solid #344054;background:#172033;color:#fff}.account{margin-top:auto;padding:12px;border:1px solid #344054;border-radius:12px;background:#111b2e;font-size:12px;overflow-wrap:anywhere}.workspace{min-width:0}.header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line)}.header h1{font-size:18px;margin:0}.header p{margin:3px 0 0;color:var(--muted);font-size:12px}main{max-width:1200px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.hero h2{margin:0 0 5px;font-size:28px}.hero p{margin:0;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}input,select{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px;background:#fff}.primary{background:var(--primary);border:1px solid var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.ghost{background:#fff;border:1px solid #d0d5dd}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f8fafc;color:#475467;font-size:11px;text-transform:uppercase}.clickable{cursor:pointer}.clickable:hover{background:#f8fafc}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef2ff;color:var(--primary);font-size:11px;font-weight:800}.good{background:#ecfdf3;color:var(--good)}.empty{padding:32px;text-align:center;color:var(--muted)}.error{background:#fef3f2;border:1px solid #fecdca;color:var(--bad);padding:12px;border-radius:10px;margin-bottom:14px}.success{background:#ecfdf3;border:1px solid #abefc6;color:#067647;padding:12px;border-radius:10px;margin-bottom:14px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.login-card .primary{width:100%}.audio-control{display:grid;grid-template-columns:minmax(180px,1fr) 220px auto;gap:10px;align-items:end}.muted{color:var(--muted);font-size:12px}.header-actions{display:flex;gap:8px}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{display:none}.header{padding:10px 16px}main{padding:18px}.audio-control,.toolbar{grid-template-columns:1fr}.hero{display:block}.header-actions{flex-wrap:wrap}}
</style>
</head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://loovwrnifdimlwpfgjza.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_eP8FFThBgpS4ox4tlP40Lg_8Y51C9sR';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const state={session:null,customers:[],organization:null,cards:[],loading:false,error:'',success:'',search:''};
const root=document.getElementById('root');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderLogin(message=''){root.innerHTML=`<div class="login"><form class="login-card" onsubmit="login(event)"><div class="mark">MX</div><h1>Audio extendido</h1><p class="muted">Acceso exclusivo del administrador principal de plataforma.</p>${message?`<div class="error">${esc(message)}</div>`:''}<div class="field"><label>Correo</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">Ingresar</button></form></div>`}
async function login(e){e.preventDefault();const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){renderLogin('Correo o contraseña incorrectos.');return}state.session=data.session;await loadCustomers()}
async function logout(){await db.auth.signOut();state.session=null;renderLogin()}
async function invoke(body){const {data,error}=await db.functions.invoke('platform-admin',{body});if(!error)return data;let message='No fue posible completar la operación.';try{const ctx=error.context;if(ctx&&typeof ctx.clone==='function'){const p=await ctx.clone().json();message=p?.error?.message||message}else if(ctx&&typeof ctx.json==='function'){const p=await ctx.json();message=p?.error?.message||message}}catch{}throw new Error(message)}
function shell(){const email=state.session?.user?.email||'';return `<div class="shell"><aside><div class="brand"><div class="mark">MX</div><div><strong>MX Business Card</strong><small>Audio extendido</small></div></div><button class="navbtn" onclick="backToCustomers()">Clientes y tarjetas</button><div class="account"><b>${esc(email)}</b><br><small>Administrador principal</small></div></aside><div class="workspace"><header class="header"><div><h1>Control de audio extendido</h1><p>30 segundos estándar · excepciones individuales hasta 15 minutos</p></div><div class="header-actions"><button class="ghost" onclick="location.href='/platform-admin.html'">Administración general</button><button class="ghost" onclick="logout()">Cerrar sesión</button></div></header><main id="main"></main></div></div>`}
function render(){if(!state.session){renderLogin();return}root.innerHTML=shell();const main=document.getElementById('main');main.innerHTML=state.organization?cardsView():customersView()}
function customersView(){const rows=state.customers.map(c=>`<tr class="clickable" onclick="openOrganization('${esc(c.organization_id)}','${esc(c.organization_name)}')"><td><b>${esc(c.organization_name)}</b></td><td>${esc(c.plan_name||'—')}</td><td>${esc(c.subscription_status||'—')}</td><td>${esc(c.used_cards??0)}</td></tr>`).join('');return `<div class="hero"><div><h2>Selecciona un cliente</h2><p>Después elige la tarjeta a la que deseas autorizar audio extendido.</p></div></div>${state.error?`<div class="error">${esc(state.error)}</div>`:''}${state.success?`<div class="success">${esc(state.success)}</div>`:''}<section class="panel"><form class="toolbar" onsubmit="searchCustomers(event)"><input id="search" value="${esc(state.search)}" placeholder="Buscar organización"><button class="primary" type="submit">Buscar</button></form>${state.loading?'<div class="empty">Cargando…</div>':rows?`<div class="table-wrap"><table class="table"><thead><tr><th>Organización</th><th>Plan</th><th>Estado</th><th>Tarjetas en uso</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No hay clientes para mostrar.</div>'}</section>`}
function cardsView(){const rows=state.cards.map(card=>`<tr><td><b>${esc(card.card_name)}</b><div class="muted">/${esc(card.slug)}</div></td><td>${esc(card.card_status)}</td><td>${card.has_audio?`<span class="badge good">Audio cargado</span>`:'<span class="badge">Sin audio</span>'}</td><td>${esc(card.audio_duration_seconds??'—')}</td><td><form class="audio-control" onsubmit="setAudioLimit(event,'${esc(card.card_id)}')"><div><label class="muted">Duración autorizada</label><select data-limit-select onchange="toggleCustom(this)"><option value="30" ${card.audio_max_seconds===30?'selected':''}>30 segundos (estándar)</option><option value="60" ${card.audio_max_seconds===60?'selected':''}>60 segundos</option><option value="120" ${card.audio_max_seconds===120?'selected':''}>2 minutos</option><option value="300" ${card.audio_max_seconds===300?'selected':''}>5 minutos</option><option value="custom" ${![30,60,120,300].includes(Number(card.audio_max_seconds))?'selected':''}>Personalizado</option></select></div><div><label class="muted">Segundos personalizados</label><input data-custom type="number" min="1" max="900" value="${esc(card.audio_max_seconds)}" ${[30,60,120,300].includes(Number(card.audio_max_seconds))?'disabled':''}></div><button class="primary" type="submit">Guardar</button></form></td></tr>`).join('');return `<div class="hero"><div><h2>${esc(state.organization.name)}</h2><p>Solo tú puedes cambiar estas excepciones.</p></div><button class="ghost" onclick="backToCustomers()">← Volver</button></div>${state.error?`<div class="error">${esc(state.error)}</div>`:''}${state.success?`<div class="success">${esc(state.success)}</div>`:''}<section class="panel">${state.loading?'<div class="empty">Cargando tarjetas…</div>':rows?`<div class="table-wrap"><table class="table"><thead><tr><th>Tarjeta</th><th>Estado</th><th>Audio</th><th>Duración actual</th><th>Excepción autorizada</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Esta organización no tiene tarjetas.</div>'}</section>`}
function toggleCustom(select){const input=select.closest('form').querySelector('[data-custom]');input.disabled=select.value!=='custom';if(!input.disabled)input.focus()}
async function loadCustomers(){state.loading=true;state.error='';render();try{const p=await invoke({action:'list_customers',search_text:state.search||null,page:1,page_size:100});state.customers=Array.isArray(p?.data)?p.data:[]}catch(e){state.error=e.message;state.customers=[]}finally{state.loading=false;render()}}
function searchCustomers(e){e.preventDefault();state.search=document.getElementById('search').value.trim();loadCustomers()}
async function openOrganization(id,name){state.organization={id,name};state.cards=[];state.loading=true;state.error='';state.success='';render();try{const p=await invoke({action:'list_customer_cards',organization_id:id});state.cards=Array.isArray(p?.data)?p.data:[]}catch(e){state.error=e.message}finally{state.loading=false;render()}}
function backToCustomers(){state.organization=null;state.cards=[];state.error='';state.success='';render()}
async function setAudioLimit(e,cardId){e.preventDefault();const form=e.currentTarget,select=form.querySelector('[data-limit-select]'),input=form.querySelector('[data-custom]');const seconds=select.value==='custom'?Number(input.value):Number(select.value);if(!Number.isInteger(seconds)||seconds<1||seconds>900){state.error='La duración debe estar entre 1 y 900 segundos.';render();return}state.loading=true;state.error='';state.success='';render();try{await invoke({action:'set_card_audio_max_seconds',card_id:cardId,audio_max_seconds:seconds});state.success=`Duración autorizada actualizada a ${seconds} segundos.`;await openOrganization(state.organization.id,state.organization.name)}catch(e){state.error=e.message;state.loading=false;render()}}
db.auth.onAuthStateChange((_,session)=>{state.session=session;if(session&&!state.customers.length)loadCustomers();else if(!session)renderLogin()});
(async()=>{const {data:{session}}=await db.auth.getSession();state.session=session;if(session)await loadCustomers();else renderLogin()})();
</script></body></html>
