name: Connect appointments phase 1

on:
  push:
    branches: [feature/appointments-phase-1]
    paths:
      - '.github/workflows/connect-appointments-phase-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect appointments modules
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          base = '<script src="/appointments-ui.js"></script>'
          fixes = '<script src="/appointments-runtime-fixes.js"></script>'
          if base not in html:
              if '</body>' not in html:
                  raise SystemExit('Closing body tag not found')
              html = html.replace('</body>', f'  {base}\n</body>', 1)
          if fixes not in html:
              html = html.replace(base, base + '\n  ' + fixes, 1)
          index.write_text(html)
          PY
      - name: Commit appointments connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Connect secure appointments runtime fixes"
          git push
