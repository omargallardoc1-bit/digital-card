<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MX Business Card</title></head>
<body>
<script>
(async()=>{
  const response=await fetch('/index.html',{cache:'no-store'});
  if(!response.ok){document.body.textContent='No se pudo cargar el panel administrativo.';return;}
  let html=await response.text();

  const dbNeedle='const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);';
  const dbReplacement=`${dbNeedle}\n  window.__mxDb=db;\n  let platformAdminAuthorized=false,platformAdminCheckedUserId=null,platformAdminCheckInFlight=false;\n  async function checkPlatformAdminAccess(){\n    const userId=state?.session?.user?.id||null;\n    if(!userId){platformAdminAuthorized=false;platformAdminCheckedUserId=null;return}\n    if(platformAdminCheckInFlight||platformAdminCheckedUserId===userId)return;\n    platformAdminAuthorized=false;platformAdminCheckedUserId=userId;platformAdminCheckInFlight=true;\n    try{\n      const {data,error}=await db.functions.invoke('platform-admin',{body:{action:'list_customers',search_text:'',page:1,page_size:1}});\n      platformAdminAuthorized=!error&&data?.ok===true;\n    }catch{platformAdminAuthorized=false}\n    finally{platformAdminCheckInFlight=false}\n    render();\n  }`;
  html=html.replace(dbNeedle,dbReplacement);

  const desktopNeedle='</nav><button class="mobile-logout"';
  const desktopReplacement='${platformAdminAuthorized?`<button type="button" onclick="location.assign(\'/platform-admin\')" aria-label="Superadministración">${uiIcon(\'organization\')}<span>Superadministración</span></button>`:\'\'}</nav><button class="mobile-logout"';
  html=html.replace(desktopNeedle,desktopReplacement);

  html=html.replace('function render(){','function render(){const platformUserId=state?.session?.user?.id||null;if(platformAdminCheckedUserId!==platformUserId){platformAdminAuthorized=false;queueMicrotask(()=>checkPlatformAdminAccess())}');
  html=html.replace('</body>','<script src="/mixed-card-plans.js"><\/script><script src="/card-visual-options.js"><\/script><script src="/card-action-icons.js"><\/script></body>');

  document.open();
  document.write(html);
  document.close();
})().catch(()=>{document.body.textContent='No se pudo cargar el panel administrativo.'});
</script>
</body>
</html>
