<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MX Business Card</title></head>
<body>
<script>
(async()=>{
  const response=await fetch('/index.html',{cache:'no-store'});
  if(!response.ok){document.body.textContent='No se pudo cargar el panel administrativo.';return;}
  let html=await response.text();

  const dbNeedle='const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);';
  const dbReplacement=`${dbNeedle}\n  let platformAdminAuthorized=false,platformAdminCheckedUserId=null,platformAdminCheckInFlight=false;\n  async function checkPlatformAdminAccess(){\n    const userId=state?.session?.user?.id||null;\n    if(!userId){platformAdminAuthorized=false;platformAdminCheckedUserId=null;return}\n    if(platformAdminCheckInFlight||platformAdminCheckedUserId===userId)return;\n    platformAdminAuthorized=false;platformAdminCheckedUserId=userId;platformAdminCheckInFlight=true;\n    try{\n      const {data,error}=await db.functions.invoke('platform-admin',{body:{action:'list_customers',search_text:'',page:1,page_size:1}});\n      platformAdminAuthorized=!error&&data?.ok===true;\n    }catch{platformAdminAuthorized=false}\n    finally{platformAdminCheckInFlight=false}\n    render();\n  }`;
  html=html.replace(dbNeedle,dbReplacement);

  const navNeedle="${visibleNavItems().map(([key,label])=>`<button type=\"button\" class=\"${state.page===key?'active':''}\" onclick=\"go('${key}')\" aria-label=\"${esc(label)}\" ${state.page===key?'aria-current=\"page\"':''}>${uiIcon(key)}<span>${label}</span></button>`).join('')}";
  const navReplacement="${visibleNavItems().map(([key,label])=>`<button type=\"button\" class=\"${state.page===key?'active':''}\" onclick=\"go('${key}')\" aria-label=\"${esc(label)}\" ${state.page===key?'aria-current=\"page\"':''}>${uiIcon(key)}<span>${label}</span></button>`).join('')}${platformAdminAuthorized?`<button type=\"button\" onclick=\"location.assign('/platform-admin')\" aria-label=\"Superadministración\">${uiIcon('organization')}<span>Superadministración</span></button>`:''}";
  html=html.replace(navNeedle,navReplacement);

  html=html.replace('function render(){','function render(){const platformUserId=state?.session?.user?.id||null;if(platformAdminCheckedUserId!==platformUserId){platformAdminAuthorized=false;queueMicrotask(()=>checkPlatformAdminAccess())}');

  document.open();
  document.write(html);
  document.close();
})().catch(()=>{document.body.textContent='No se pudo cargar el panel administrativo.'});
</script>
</body>
</html>
