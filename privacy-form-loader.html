<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MX Business Card</title></head>
<body>
<script>
(async()=>{
  try{
    const response=await fetch('/index.html',{cache:'no-store'});
    if(!response.ok)throw new Error('No se pudo cargar la tarjeta.');
    let html=await response.text();
    const dbNeedle='const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);';
    html=html.replace(dbNeedle,`${dbNeedle}\n  window.__mxDb=db;`);
    html=html.replace('</body>','<script src="/privacy-form-link.js"><\/script><script src="/card-visual-options.js"><\/script><script src="/card-action-icons.js"><\/script><script src="/social-brand-colors.js"><\/script><script src="/public-share-menu.js"><\/script><script src="/public-action-grid.js"><\/script><script src="/card-cover-carousel.js?v=cover-1"><\/script><script src="/public-card-audio.js?v=audio-4"><\/script><script src="/card-video.js?v=video-1"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.body.innerHTML='<main style="font:16px system-ui;padding:32px;text-align:center"><h1>MX Business Card</h1><p>No fue posible cargar esta tarjeta.</p></main>';
  }
})();
</script>
</body>
</html>
