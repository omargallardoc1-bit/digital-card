<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Card — MVP</title>
<style>
:root{--nav:#091329;--purple:#5b3df5;--purple2:#7a5cff;--bg:#f5f6fb;--text:#172033;--muted:#6d7484;--card:#fff;--line:#e5e8f0;--green:#18a957;--orange:#ff8a2a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:235px;background:var(--nav);color:#fff;padding:24px 14px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center;padding:4px 8px 26px}.brand .ico{background:linear-gradient(135deg,#6b4cff,#9a75ff);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d8deeb;padding:12px 14px;border-radius:11px;margin:5px 0}.nav button.active,.nav button:hover{background:linear-gradient(90deg,#5b3df5,#704ff7);color:white}.user{position:absolute;bottom:18px;left:14px;right:14px;padding:12px;border:1px solid #27314a;border-radius:12px}.main{margin-left:235px;padding:30px;width:calc(100% - 235px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0;color:var(--muted)}.primary{background:var(--purple);color:white;padding:12px 18px;border-radius:10px;font-weight:700}.ghost{background:#fff;border:1px solid var(--line);padding:11px 15px;border-radius:10px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 2px 10px #1b245008}.stat{padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:7px}.up{color:var(--green);font-size:12px;margin-top:6px}.two{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px}.panel h2{font-size:17px;margin:0 0 15px}.activity{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.dot{width:34px;height:34px;border-radius:10px;background:#eeeaff;display:grid;place-items:center}.cards{margin-top:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}.badge{padding:4px 8px;border-radius:8px;background:#eeeaff;color:#4f35d7;font-weight:700}.active{color:var(--green)}.editor{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.steps{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.step{min-width:86px;text-align:center;color:#778094;font-size:11px}.step b{display:grid;place-items:center;margin:auto auto 6px;width:30px;height:30px;border-radius:50%;background:#eef0f6}.step.current{color:var(--purple)}.step.current b{background:var(--purple);color:white}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea{min-height:92px;resize:vertical}.previewWrap{position:sticky;top:20px}.phone{width:310px;max-width:100%;margin:auto;background:#101525;border-radius:35px;padding:10px;box-shadow:0 18px 40px #11182733}.screen{background:#fff;border-radius:27px;overflow:hidden;min-height:600px}.hero{height:255px;background:linear-gradient(145deg,#241568,#6237df);color:#fff;padding:22px;display:flex;flex-direction:column;justify-content:flex-end}.avatar{width:78px;height:78px;border-radius:50%;background:#dfe3ef;color:#333;display:grid;place-items:center;font-size:27px;font-weight:800;border:3px solid white;margin-bottom:10px}.hero h2{margin:0;font-size:25px}.hero p{margin:4px 0}.mini{padding:15px}.action{width:100%;padding:12px;border-radius:10px;margin-bottom:8px;background:#eee;color:#182033;font-weight:700}.wa{background:#16a85b;color:white}.social{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.social span{background:#eef0f5;padding:7px 9px;border-radius:8px;font-size:12px}.section{padding:12px 0;border-top:1px solid var(--line)}.service{padding:10px 0;border-bottom:1px solid var(--line)}.service:last-child{border:0}.capture{background:#f4f1ff;border:1px solid #d9d0ff;padding:13px;border-radius:12px;margin-top:12px}.switch{display:flex;justify-content:space-between;align-items:center}.toggle{width:42px;height:24px;background:#cfd4df;border-radius:20px;position:relative}.toggle.on{background:var(--purple)}.toggle:after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px}.toggle.on:after{left:21px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none}.hidden{display:none!important}@media(max-width:950px){.side{width:72px}.brand span,.nav button span,.user{display:none}.main{margin-left:72px;width:calc(100% - 72px)}.grid5{grid-template-columns:repeat(2,1fr)}.two,.editor{grid-template-columns:1fr}.previewWrap{position:static}}@media(max-width:600px){.main{padding:16px}.grid5{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.top .primary{font-size:12px;padding:10px}.phone{width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="ico">▣</div><span>DIGITAL CARD</span></div><div class="nav" id="nav"></div><div class="user">👤 <b>Administrador</b></div></aside>
<main class="main" id="main"></main>
</div><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://loovwrnifdimlwpfgjza.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eP8FFThBgpS4ox4tlP40Lg_8Y51C9sR';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const state={page:'dashboard',step:1,card:{id:'CARD-000001',name:'Víctor Piña',role:'CEO & Fundador',company:'P&M Group',slogan:'Transformamos estrategia, tecnología y talento en resultados para tu empresa.',about:'Impulsamos empresas con Marketing Digital, IA, generación de leads, Contact Center y estrategias comerciales.',phone:'+52 667 000 0000',wa:'526670000000',email:'contacto@pmgroup.mx',web:'https://example.com',location:'Ciudad de México',instagram:'https://instagram.com/',linkedin:'https://linkedin.com/',facebook:'https://facebook.com/',tiktok:'https://tiktok.com/',youtube:'https://youtube.com/',x:'https://x.com/',capture:true,services:[['Contact Center & BPO','Ventas y conversión de leads, atención al cliente y gestión omnicanal.'],['Marketing Digital','Campañas y estrategias para generar leads y acelerar crecimiento.'],['Inteligencia Artificial','Automatización, contenido y optimización de procesos.']]},leads:[{id:'LEAD-000001',name:'Juan Pérez',phone:'+52 667 123 4567',email:'juan@email.com',card:'Víctor Piña',date:'13/08/2026 16:25',source:'QR',action:'WhatsApp'}]};
const navItems=[['dashboard','⌂','Dashboard'],['cards','▣','Mis Digital Cards'],['leads','♙','Prospectos'],['stats','⌁','Estadísticas'],['templates','▧','Plantillas'],['qr','▦','QR Codes'],['clients','♧','Clientes / Empresas'],['plans','▤','Suscripciones'],['settings','⚙','Configuración'],['integrations','◈','Integraciones'],['help','?','Ayuda']];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function nav(){document.getElementById('nav').innerHTML=navItems.map(([k,i,l])=>`<button class="${state.page===k?'active':''}" onclick="go('${k}')">${i} <span>${l}</span></button>`).join('')}
function go(p){state.page=p;render()}
function render(){nav();const m=document.getElementById('main');if(state.page==='dashboard')m.innerHTML=dashboard();else if(state.page==='cards')m.innerHTML=cards();else if(state.page==='leads')m.innerHTML=leads();else if(state.page==='editor')m.innerHTML=editor();else m.innerHTML=placeholder(state.page);}
function dashboard(){return `<div class="top"><div><h1>¡Bienvenido, Administrador! 👋</h1><p>Aquí tienes un resumen de tu cuenta y actividad.</p></div><button class="primary" onclick="newCard()">＋ Crear nueva Digital Card</button></div><div class="grid5"><div class="stat"><small>Visitas totales</small><strong>12,458</strong><div class="up">↑ 18.6% vs. mes anterior</div></div><div class="stat"><small>Prospectos captados</small><strong>1,248</strong><div class="up">↑ 24.3% vs. mes anterior</div></div><div class="stat"><small>Clics en WhatsApp</small><strong>2,856</strong><div class="up">↑ 15.8%</div></div><div class="stat"><small>Llamadas realizadas</small><strong>1,025</strong><div class="up">↑ 12.1%</div></div><div class="stat"><small>Contactos guardados</small><strong>845</strong><div class="up">↑ 10.4%</div></div></div><div class="two"><div class="panel"><h2>Rendimiento · últimos 30 días</h2><div style="height:240px;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#f8f7ff);border-radius:10px;color:#6b5ce7;font-size:18px">📈 Visitas 12,458 · Prospectos 1,248 · WhatsApp 2,856</div></div><div class="panel"><h2>Actividad reciente</h2>${['Nuevo prospecto en Tarjeta “Víctor Piña”','Visita desde QR','Clic en WhatsApp','Nueva Digital Card creada','Prospecto exportado'].map((x,i)=>`<div class="activity"><div class="dot">${['♙','▦','◉','＋','↓'][i]}</div><div><b>${x}</b><small style="display:block;color:#7a8190">hace ${i*17+5} min</small></div></div>`).join('')}</div></div><div class="panel cards"><h2>Mis Digital Cards</h2>${cardTable()}</div>`}
function cardTable(){return `<table class="table"><thead><tr><th>Tarjeta</th><th>Cliente / Empresa</th><th>Paquete</th><th>Estado</th><th>Visitas</th><th>Prospectos</th><th></th></tr></thead><tbody><tr><td><b>${esc(state.card.name)}</b><small style="display:block;color:#735bf2">digitalcard.mx/${slug()}</small></td><td>${esc(state.card.company)}</td><td><span class="badge">Élite</span></td><td class="active">● Activa</td><td>248</td><td>${state.leads.length}</td><td><button class="ghost" onclick="editCard()">Editar</button></td></tr></tbody></table>`}
function cards(){return `<div class="top"><div><h1>Mis Digital Cards</h1><p>Administra tus tarjetas digitales.</p></div><button class="primary" onclick="newCard()">＋ Crear nueva</button></div><div class="panel">${cardTable()}</div>`}
function leads(){return `<div class="top"><div><h1>Prospectos</h1><p>Contactos captados de forma opcional después de visitar la tarjeta.</p></div><button class="primary" onclick="exportCSV()">↓ Exportar CSV</button></div><div class="panel"><table class="table"><thead><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Tarjeta</th><th>Fecha</th><th>Fuente</th><th>Acción</th></tr></thead><tbody>${state.leads.map(l=>`<tr><td>${l.id}</td><td>${esc(l.name)}</td><td>${esc(l.phone)}</td><td>${esc(l.email)}</td><td>${esc(l.card)}</td><td>${l.date}</td><td>${l.source}</td><td>${l.action}</td></tr>`).join('')}</tbody></table></div>`}
function editor(){const c=state.card;return `<div class="top"><div><h1>Crear / Editar Digital Card</h1><p>Los cambios se reflejan en la vista previa.</p></div><div><button class="ghost" onclick="publicCard()">Vista pública</button> <button class="primary" onclick="saveCard()">Guardar</button></div></div><div class="editor"><div class="panel"><div class="steps">${['Información','Contacto','Redes','Contenido','Botones','Diseño','Captura','Publicar'].map((x,i)=>`<div class="step ${state.step===i+1?'current':''}" onclick="state.step=${i+1};render()"><b>${i+1}</b>${x}</div>`).join('')}</div>${formStep()}</div><div class="previewWrap"><div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>Vista previa en tiempo real</b><button class="ghost" onclick="toast('Plantillas: próximamente')">Cambiar plantilla</button></div>${phonePreview()}<div class="capture"><div class="switch"><b>Captura de prospectos</b><div class="toggle ${c.capture?'on':''}" onclick="c.capture=!c.capture;render()"></div></div><small>Se muestra después de que el visitante vea la tarjeta. Nunca bloquea el acceso.</small></div></div></div></div>`}
function formStep(){const c=state.card; if(state.step===1)return `<div class="formgrid"><div class="field"><label>Nombre(s)</label><input value="${esc(c.name)}" oninput="c.name=this.value;syncPreview()"></div><div class="field"><label>Cargo / Puesto</label><input value="${esc(c.role)}" oninput="c.role=this.value;syncPreview()"></div><div class="field"><label>Empresa</label><input value="${esc(c.company)}" oninput="c.company=this.value;syncPreview()"></div><div class="field"><label>Frase o eslogan</label><input value="${esc(c.slogan)}" oninput="c.slogan=this.value;syncPreview()"></div><div class="field full"><label>Descripción</label><textarea oninput="c.about=this.value;syncPreview()">${esc(c.about)}</textarea></div></div>`;if(state.step===2)return `<div class="formgrid">${[['phone','Teléfono'],['wa','WhatsApp'],['email','Correo'],['web','Sitio web'],['location','Ubicación']].map(([k,l])=>`<div class="field"><label>${l}</label><input value="${esc(c[k])}" oninput="c['${k}']=this.value;syncPreview()"></div>`).join('')}</div>`;if(state.step===3)return `<div class="formgrid">${[['instagram','Instagram'],['linkedin','LinkedIn'],['facebook','Facebook'],['tiktok','TikTok'],['youtube','YouTube'],['x','X']].map(([k,l])=>`<div class="field"><label>${l}</label><input value="${esc(c[k])}" oninput="c['${k}']=this.value;syncPreview()"></div>`).join('')}</div>`;if(state.step===4)return `<div><h3>Servicios</h3>${c.services.map((s,i)=>`<div class="field"><label>${i+1}. ${esc(s[0])}</label><textarea oninput="c.services[${i}][1]=this.value;syncPreview()">${esc(s[1])}</textarea></div>`).join('')}<button class="ghost" onclick="c.services.push(['Nuevo servicio','Descripción del servicio']);render()">＋ Agregar servicio</button></div>`;if(state.step===5)return `<p>Selecciona los botones visibles en tu tarjeta.</p><label><input type="checkbox" checked> WhatsApp</label><br><label><input type="checkbox" checked> Llamar</label><br><label><input type="checkbox" checked> Correo</label><br><label><input type="checkbox" checked> Sitio web</label><br><label><input type="checkbox" checked> Ubicación</label>`;if(state.step===6)return `<div class="formgrid"><div class="field"><label>Plantilla</label><select><option>Elegante</option><option>Profesional</option><option>Minimalista</option></select></div><div class="field"><label>Color principal</label><input type="color" value="#5b3df5"></div><div class="field full"><label>Imagen de portada</label><input type="file" accept="image/*" onchange="toast('Carga de imágenes lista para conectar al almacenamiento')"></div></div>`;if(state.step===7)return `<div class="capture"><b>Captura opcional después de visualizar la tarjeta</b><p>Nombre + WhatsApp obligatorios. Correo opcional.</p><label><input type="checkbox" ${c.capture?'checked':''} onchange="c.capture=this.checked;render()"> Activar captura de prospectos</label></div>`;return `<div style="text-align:center;padding:30px"><h2>Lista para publicar</h2><p>URL permanente: <b>digitalcard.mx/${slug()}</b></p><p>El QR apuntará siempre a esta URL.</p><button class="primary" onclick="publicCard()">🚀 Publicar Digital Card</button></div>`}
function slug(){return cslug(state.card.name)}function cslug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'mi-card'}
function phonePreview(){const c=state.card;return `<div class="phone"><div class="screen"><div class="hero"><div class="avatar">${esc(c.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><h2>${esc(c.name)}</h2><p>${esc(c.role)}</p><p style="opacity:.8">${esc(c.company)}</p><small>${esc(c.slogan)}</small></div><div class="mini"><div class="social"><span>in</span><span>◎</span><span>f</span><span>▶</span><span>♪</span></div><button class="action wa">WhatsApp</button><button class="action">Llamar ahora</button><button class="action">Enviar correo</button><button class="action">Visitar sitio web</button><div class="section"><b>Acerca de</b><p style="font-size:13px;color:#667085">${esc(c.about)}</p></div><div class="section"><b>Servicios</b>${c.services.slice(0,3).map(s=>`<div class="service"><b>${esc(s[0])}</b><div style="font-size:12px;color:#667085">${esc(s[1])}</div></div>`).join('')}</div></div></div></div>`}
function syncPreview(){const p=document.querySelector('.previewWrap .panel');if(p){const cap=state.card.capture; p.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>Vista previa en tiempo real</b><button class="ghost" onclick="toast('Plantillas: próximamente')">Cambiar plantilla</button></div>${phonePreview()}<div class="capture"><div class="switch"><b>Captura de prospectos</b><div class="toggle ${cap?'on':''}" onclick="state.card.capture=!state.card.capture;render()"></div></div><small>Se muestra después de que el visitante vea la tarjeta. Nunca bloquea el acceso.</small></div>`}}
function newCard(){state.card={...state.card,id:'CARD-'+String(Date.now()).slice(-6),name:'Nueva persona',role:'Profesional',company:'Nueva empresa',slogan:'Tu marca. Tu conexión.',about:'Escribe aquí la presentación de tu negocio.',phone:'',wa:'',email:'',web:'',location:'',instagram:'',linkedin:'',facebook:'',tiktok:'',youtube:'',x:'',capture:true,services:[['Servicio 1','Describe tu servicio.']]};state.step=1;state.page='editor';render()}
function editCard(){state.step=1;state.page='editor';render()}function saveCard(){localStorage.setItem('digitalCardMVP',JSON.stringify(state));toast('Digital Card guardada')}function publicCard(){localStorage.setItem('digitalCardMVP',JSON.stringify(state));state.page='public';render()}function exportCSV(){const rows=[['ID','Nombre','Telefono','Correo','Tarjeta','Fecha','Fuente','Accion'],...state.leads.map(x=>[x.id,x.name,x.phone,x.email,x.card,x.date,x.source,x.action])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='digital-card-prospectos.csv';a.click()}
function publicPage(){const c=state.card;return `<div class="top"><div><h1>Tarjeta pública</h1><p>Así la verá el visitante.</p></div><button class="primary" onclick="editCard()">← Volver al editor</button></div><div style="max-width:430px;margin:auto">${phonePreview()}<div class="panel" style="margin-top:15px"><h2>Captura opcional</h2><p>Después de visitar la tarjeta, el visitante puede dejar sus datos.</p><button class="primary" onclick="showLead()">Probar captura de prospecto</button></div></div>`}function showLead(){const name=prompt('Nombre');if(!name)return;const phone=prompt('WhatsApp / teléfono');if(!phone)return;const email=prompt('Correo (opcional)')||'';state.leads.push({id:'LEAD-'+String(state.leads.length+1).padStart(6,'0'),name,phone,email,card:state.card.name,date:new Date().toLocaleString('es-MX'),source:'Enlace',action:'Vista'});toast('¡Gracias! Tus datos fueron registrados.')}function placeholder(p){return `<div class="top"><div><h1>${navItems.find(x=>x[0]===p)?.[2]||'Módulo'}</h1><p>Este módulo forma parte de la siguiente fase del MVP.</p></div></div><div class="panel" style="padding:50px;text-align:center">🚧 <h2>En construcción</h2><p>La arquitectura ya está preparada para este módulo.</p></div>`}
render();
</script>
</body></html>
