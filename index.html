  async function loadOrganizationContext(){if(!state.session)return;state.organizationLoading=true;state.qrCapabilitiesLoading=true;state.qrCapabilitiesError='';render();const {data:memberships,error:membershipError}=await db.from('organization_members').select('organization_id,role,status,created_at,organizations!inner(id,name,status)').eq('user_id',state.session.user.id).eq('status','active').order('created_at',{ascending:true}).limit(1);if(membershipError){state.organizationLoading=false;state.qrCapabilitiesLoading=false;state.qrCapabilities=emptyQrCapabilities();state.qrCapabilitiesError='No se pudieron consultar las capacidades QR.';toast('No se pudo cargar la organización: '+membershipError.message);render();return}const membership=memberships?.[0]||null;if(!membership){state.organization=null;state.organizationMembership=null;state.organizationCards=[];state.subscription=null;state.plan=null;state.organizationUsage={cards:0,members:0};state.organizationLoading=false;state.qrCapabilitiesLoading=false;state.qrCapabilities=emptyQrCapabilities();state.qrCapabilitiesError='No se encontró una organización activa.';render();return}const organization=membership.organizations,organizationId=membership.organization_id;const [cardsResponse,membersResponse,subscriptionResponse,qrCapabilitiesResponse]=await Promise.all([db.from('digital_cards').select('id,slug,name,company,status,organization_id').eq('organization_id',organizationId).order('updated_at',{ascending:false}),db.from('organization_members').select('user_id',{count:'exact',head:true}).eq('organization_id',organizationId).eq('status','active'),db.from('organization_subscriptions').select('id,organization_id,plan_id,status,starts_at,expires_at,renewal_type,plans!inner(*)').eq('organization_id',organizationId).in('status',['trial','active','past_due']).order('starts_at',{ascending:false}).limit(1).maybeSingle(),db.rpc('get_organization_qr_capabilities',{target_organization_id:organizationId})]);const failed=[cardsResponse,membersResponse,subscriptionResponse].find(response=>response.error);if(failed){state.organizationLoading=false;state.qrCapabilitiesLoading=false;state.qrCapabilities=emptyQrCapabilities();state.qrCapabilitiesError='No se pudieron consultar las capacidades QR.';toast('No se pudo cargar la información organizacional: '+failed.error.message);render();return}state.organization=organization;state.organizationMembership={organization_id:organizationId,role:membership.role,status:membership.status};state.organizationCards=cardsResponse.data||[];state.subscription=subscriptionResponse.data?{...subscriptionResponse.data,plans:undefined}:null;state.plan=subscriptionResponse.data?.plans||null;state.organizationUsage={cards:state.organizationCards.filter(card=>card.status==='draft'||card.status==='published').length,members:membersResponse.count||0};if(qrCapabilitiesResponse.error){state.qrCapabilities=emptyQrCapabilities();state.qrCapabilitiesError='No se pudieron consultar las capacidades QR: '+qrCapabilitiesResponse.error.message}else{const qrRow=Array.isArray(qrCapabilitiesResponse.data)?qrCapabilitiesResponse.data[0]:qrCapabilitiesResponse.data;state.qrCapabilities={qr_enabled:qrRow?.qr_enabled===true,qr_custom_colors:qrRow?.qr_custom_colors===true,qr_logo_enabled:qrRow?.qr_logo_enabled===true,qr_premium_styles:qrRow?.qr_premium_styles===true,effective_subscription_status:String(qrRow?.effective_subscription_status||'no_subscription')};state.qrCapabilitiesError=''}state.organizationLoading=false;state.qrCapabilitiesLoading=false;render()}
  async function go(page){state.page=page;if(page==='prospects')await loadProspects();else if(page==='dashboard')await loadMetrics();else if(page==='team'){if(!state.organization)await loadOrganizationContext();if(state.organization?.id){await loadOrganizationMembers();await loadOrganizationInvitations();render()}else render()}else if(page==='organization'||page==='subscription')await loadOrganizationContext();else render()}

  async function loadCards(){if(!state.session)return;const {data,error}=await db.from('digital_cards').select('*').eq('owner_id',state.session.user.id).order('updated_at',{ascending:false});if(error){toast('No se pudieron cargar las tarjetas: '+error.message);return}state.cards=await Promise.all((data||[]).map(async row=>resolveCardSocials(await resolveCardMedia(cardFromRow(row)))));if(state.page==='dashboard')await loadMetrics();else render()}
  async function loadMetrics(){if(!state.session)return;if(!state.organization)await loadOrganizationContext();state.metricsLoading=true;state.metricsError='';render();if(!state.organization?.id){state.metrics=emptyMetrics();state.metricsLoading=false;state.metricsError='No se encontró una organización activa.';render();return}const requestedDays=state.metricsPeriod==='all'?null:Number(state.metricsPeriod),targetCard=state.metricsCard==='all'?null:state.metricsCard;const {data,error}=await db.rpc('get_organization_metrics',{target_organization_id:state.organization.id,target_card_id:targetCard,requested_days:requestedDays});if(error){state.metrics=emptyMetrics();state.metricsAppliedDays=null;state.metricsError=/no incluye estadísticas/i.test(error.message)?'Tu plan actual no incluye estadísticas.':error.message;state.metricsLoading=false;render();return}const row=Array.isArray(data)?data[0]:data;state.metrics={view:Number(row?.views||0),whatsapp_click:Number(row?.whatsapp_clicks||0),call_click:Number(row?.calls||0),email_click:Number(row?.emails||0),website_click:Number(row?.website_clicks||0),lead_created:Number(row?.leads||0),conversion_rate:Number(row?.conversion_rate||0)};state.metricsAppliedDays=row?.applied_days??null;state.metricsLoading=false;render()}
  function metricsPanel(){const m=state.metrics,periodNote=state.metricsAppliedDays?`Periodo autorizado: últimos ${state.metricsAppliedDays} días.`:'';return `<div class="panel"><div class="filters"><div class="field"><label>Periodo</label><select onchange="setMetricsPeriod(this.value)"><option value="all" ${state.metricsPeriod==='all'?'selected':''}>Total</option><option value="7" ${state.metricsPeriod==='7'?'selected':''}>Últimos 7 días</option><option value="30" ${state.metricsPeriod==='30'?'selected':''}>Últimos 30 días</option></select></div><div class="field"><label>Tarjeta</label><select onchange="setMetricsCard(this.value)"><option value="all">Todas las tarjetas</option>${state.cards.map(card=>`<option value="${esc(card.id)}" ${state.metricsCard===card.id?'selected':''}>${esc(card.name)}</option>`).join('')}</select></div><button class="ghost" onclick="exportMetricsCsv()" ${state.metricsLoading||!!state.metricsError?'disabled':''}>Exportar métricas CSV</button></div>${state.metricsError?`<div class="error">${esc(state.metricsError)}</div>`:`<div class="metrics">${metricBox('Visitas',m.view)}${metricBox('WhatsApp',m.whatsapp_click)}${metricBox('Llamadas',m.call_click)}${metricBox('Correos',m.email_click)}${metricBox('Clics web',m.website_click)}${metricBox('Prospectos',m.lead_created)}${metricBox('Conversión',m.conversion_rate.toFixed(1)+' %')}</div><p style="color:var(--muted)">${esc(periodNote)}</p>`}${state.metricsLoading?'<p style="color:var(--muted)">Actualizando métricas…</p>':''}</div>`}
  function metricBox(label,value){return `<div class="metric"><span>${esc(label)}</span><b>${esc(value)}</b></div>`}

  function exportMetricsCsv(){const m=state.metrics,card=state.metricsCard==='all'?'Todas las tarjetas':state.cards.find(item=>item.id===state.metricsCard)?.name||'',period=state.metricsAppliedDays?`Últimos ${state.metricsAppliedDays} días`:'Total autorizado';const rows=[['Periodo','Tarjeta','Visitas','WhatsApp','Llamadas','Correos','Clics web','Prospectos','Conversión %'],[period,card,m.view,m.whatsapp_click,m.call_click,m.email_click,m.website_click,m.lead_created,m.conversion_rate.toFixed(1)]];downloadCsv('metricas-digital-card.csv',rows)}
  function downloadCsv(filename,rows){const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)}
  async function loadProspects(){if(!state.session)return;if(!state.organization)await loadOrganizationContext();if(!state.organization?.id){state.prospects=[];state.prospectsTotal=0;toast('No se encontró una organización activa.');render();return}state.prospectsLoading=true;render();const {data,error}=await db.rpc('list_organization_prospects',{target_organization_id:state.organization.id,target_card_id:state.prospectsCard==='all'?null:state.prospectsCard,requested_page:state.prospectsPage,requested_page_size:Math.min(state.prospectsPageSize,100),sort_direction:state.prospectsSort});if(error){state.prospects=[];state.prospectsTotal=0;state.prospectsLoading=false;toast('No se pudieron cargar los prospectos: '+error.message);render();return}const result=Array.isArray(data)?data[0]:data;state.prospects=Array.isArray(result?.items)?result.items:[];state.prospectsTotal=Number(result?.total_count||0);state.prospectsPage=Number(result?.page_number||1);state.prospectsPageSize=Math.min(Number(result?.page_size||50),100);state.prospectsLoading=false;render()}
  function prospectsView(){const pages=Math.max(1,Math.ceil(state.prospectsTotal/state.prospectsPageSize));return `<div class="top"><div><h1>Prospectos</h1><p>Contactos capturados desde tus tarjetas públicas.</p></div><button class="primary" onclick="exportProspectsCsv()" ${state.prospectsTotal&&!state.prospectsLoading?'':'disabled'}>Exportar CSV</button></div><div class="panel"><div class="filters"><div class="field"><label>Tarjeta</label><select onchange="setProspectsCard(this.value)"><option value="all">Todas las tarjetas</option>${state.organizationCards.map(card=>`<option value="${esc(card.id)}" ${state.prospectsCard===card.id?'selected':''}>${esc(card.name)}</option>`).join('')}</select></div><div class="field"><label>Orden</label><select onchange="setProspectsSort(this.value)"><option value="desc" ${state.prospectsSort==='desc'?'selected':''}>Más recientes</option><option value="asc" ${state.prospectsSort==='asc'?'selected':''}>Más antiguos</option></select></div><div class="field"><label>Filas</label><select onchange="setProspectsPageSize(this.value)"><option value="25" ${state.prospectsPageSize===25?'selected':''}>25</option><option value="50" ${state.prospectsPageSize===50?'selected':''}>50</option><option value="100" ${state.prospectsPageSize===100?'selected':''}>100</option></select></div></div><div class="table-wrap">${state.prospectsLoading?'<div class="empty">Cargando prospectos…</div>':prospectsTable()}</div><div class="top" style="margin:16px 0 0"><p>Página ${esc(state.prospectsPage)} de ${esc(pages)} · ${esc(state.prospectsTotal)} prospectos</p><div><button class="ghost" onclick="changeProspectsPage(-1)" ${state.prospectsPage<=1||state.prospectsLoading?'disabled':''}>Anterior</button> <button class="ghost" onclick="changeProspectsPage(1)" ${state.prospectsPage>=pages||state.prospectsLoading?'disabled':''}>Siguiente</button></div></div></div>`}
  function prospectsTable(){if(!state.prospects.length)return `<div class="empty">Aún no hay prospectos para tus Digital Cards.</div>`;return `<table class="table"><thead><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Tarjeta</th><th>Fecha</th><th>Origen</th><th>Consentimiento</th></tr></thead><tbody>${state.prospects.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(p.email||'—')}</td><td>${esc(p.card_name||'—')}</td><td>${esc(formatDate(p.created_at))}</td><td>${esc(p.source)}</td><td>${p.consent_given?`Sí · ${esc(p.consent_version||'—')}`:'No'}</td></tr>`).join('')}</tbody></table>`}
  async function setProspectsCard(value){if(value!=='all'&&!state.organizationCards.some(card=>card.id===value))return;state.prospectsCard=value;state.prospectsPage=1;await loadProspects()}

  async function exportProspectsCsv(){if(!state.session||!state.organization?.id)return;const response=await fetch(SUPABASE_URL+'/functions/v1/export-prospects-csv',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+state.session.access_token},body:JSON.stringify({organization_id:state.organization.id,card_id:state.prospectsCard==='all'?null:state.prospectsCard,sort_direction:state.prospectsSort})});if(!response.ok){let message='No se pudo exportar el CSV.';try{const detail=await response.json();if(detail?.error)message=detail.error}catch{}toast(message);return}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='prospectos.csv';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)}
  async function login(event){event.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await db.auth.signInWithPassword({email,password});if(error){document.getElementById('login-error').textContent=authMessage(error);return}state.session=data.session;await loadCards()}

  function editableCardRpcArgs(payload){return {card_name:payload.name,card_position:payload.position,card_company:payload.company,card_slogan:payload.slogan,card_description:payload.description,card_phone:payload.phone,card_whatsapp:payload.whatsapp,card_email:payload.email,card_website:payload.website,card_location:payload.location,card_capture_enabled:payload.capture_enabled}}
  function cardRpcMessage(error,action){const message=String(error?.message||'').trim();if(!message)return `No se pudo ${action}.`;if(/máximo de Digital Cards/i.test(message))return 'La organización alcanzó el límite de Digital Cards de su plan.';if(/suscripción utilizable/i.test(message))return 'La organización no tiene una suscripción utilizable.';if(/pago pendiente|past_due/i.test(message))return 'La suscripción tiene un pago pendiente y esta operación no está disponible.';if(/permiso/i.test(message))return 'No tienes permisos para realizar esta operación.';if(/organización no está activa/i.test(message))return 'La organización no está activa.';return `No se pudo ${action}: ${message}`}
  async function refreshCardAndOrganization(cardId){const {data,error}=await db.from('digital_cards').select('*').eq('id',cardId).eq('owner_id',state.session.user.id).single();if(error){toast('No se pudo recargar la tarjeta: '+error.message);return null}state.card=await resolveCardSocials(await resolveCardMedia(cardFromRow(data)));await loadCards();await loadOrganizationContext();return data}
  async function saveCard(){if(!state.session)return false;const wasNew=!state.card.id,payload=cardPayload();if(!payload.slug){toast('Indica un nombre para generar la URL.');return false}let response;if(state.card.id){if(!state.card.organization_id){toast('Esta tarjeta no está asignada a una organización y requiere migración administrativa.');return false}response=await db.rpc('update_organization_card',{target_card_id:state.card.id,...editableCardRpcArgs(payload)})}else{if(!state.organization)await loadOrganizationContext();if(!state.organization?.id){toast('No se encontró una organización activa para crear la tarjeta.');return false}response=await db.rpc('create_organization_card',{target_organization_id:state.organization.id,card_slug:payload.slug,...editableCardRpcArgs(payload)})}if(response.error){toast(cardRpcMessage(response.error,wasNew?'crear la tarjeta':'guardar la tarjeta'));return false}const responseRow=Array.isArray(response.data)?response.data[0]:response.data;if(!responseRow?.id){toast('La operación no devolvió una tarjeta válida.');return false}if(!await saveCardSocials(responseRow.id,state.card.socials))return false;const confirmed=await refreshCardAndOrganization(responseRow.id);if(!confirmed)return false;const verificationFields=['name','position','company','slogan','description','phone','whatsapp','email','website','location','capture_enabled'];if(wasNew)verificationFields.unshift('slug');const mismatch=verificationFields.find(key=>(confirmed[key]??null)!==(payload[key]??null));if(mismatch){const message=`La verificación no coincide en ${mismatch}: esperado ${payload[mismatch]??null}, recibido ${confirmed[mismatch]??null}`;toast(message);return false}toast(language==='en'?'Digital Card saved successfully.':'Digital Card guardada correctamente.');render();return true}
  async function setCardStatus(cardId,status){if(!state.session||!cardId)return false;const card=state.cards.find(item=>item.id===cardId)||(state.card.id===cardId?state.card:null);if(!card?.organization_id){toast('Esta tarjeta no está asignada a una organización y requiere migración administrativa.');return false}const response=await db.rpc('set_card_status',{target_card_id:cardId,target_status:status});if(response.error){toast(cardRpcMessage(response.error,'cambiar el estado de la tarjeta'));return false}const confirmed=await refreshCardAndOrganization(cardId);if(!confirmed)return false;return true}

  function prospectForm(card){if(prospectAlreadySent(card.id))return `<div class="panel lead-panel success"><b>Datos enviados correctamente.</b><br>Gracias por compartir tu información.</div>`;return `<div class="panel lead-panel" id="prospect-panel"><h2>¿Quieres que te contactemos?</h2><p style="color:var(--muted)">Déjanos tus datos de forma opcional. La tarjeta y sus medios de contacto permanecen disponibles sin completar este formulario.</p><form onsubmit="submitProspect(event)"><div class="field"><label>Nombre</label><input name="name" maxlength="120" autocomplete="name" required></div><div class="field"><label>Teléfono</label><input name="phone" type="tel" maxlength="40" autocomplete="tel" required></div><div class="field"><label>Correo (opcional)</label><input name="email" type="email" maxlength="254" autocomplete="email"></div><div class="field check"><label><input name="consentimiento" type="checkbox" required><span class="consent">Acepto que mis datos sean utilizados para que el titular de esta Digital Card me contacte en relación con sus productos o servicios. Puedo decidir no enviar este formulario y seguir usando la tarjeta.</span></label></div><div class="error" data-prospect-error role="alert"></div><button class="primary" type="submit">Enviar mis datos</button></form></div>`}
  async function submitProspect(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),errorEl=form.querySelector('[data-prospect-error]');if(!state.publicCard||prospectAlreadySent(state.publicCard.id))return;errorEl.textContent='';button.disabled=true;button.textContent='Enviando…';const values=new FormData(form);const payload={card_id:state.publicCard.id,name:String(values.get('name')??'').trim(),phone:String(values.get('phone')??'').trim(),email:String(values.get('email')??'').trim(),source:publicEventSource(),consentimiento:values.get('consentimiento')==='on'};const {error}=await db.functions.invoke('create-prospect',{body:payload});if(error){let message='No fue posible enviar tus datos. Inténtalo nuevamente.';try{const detail=await error.context.json();if(detail?.error)message=detail.error}catch{}errorEl.textContent=message;button.disabled=false;button.textContent='Enviar mis datos';return}try{sessionStorage.setItem(prospectSessionKey(state.publicCard.id),'1')}catch{}document.getElementById('prospect-panel').outerHTML=`<div class="panel lead-panel success"><b>Datos enviados correctamente.</b><br>Gracias por compartir tu información.</div>`}
  async function renderPublic(){const slug=decodeURIComponent(location.pathname.replace(/^\/c\/?/, '')).split('/')[0];document.getElementById('root').innerHTML='<div class="public-shell"><div class="panel">Cargando tarjeta…</div></div>';finishRender();if(!slug){publicError('Tarjeta no encontrada.');return}const {data,error}=await db.from('digital_cards').select('*').eq('slug',slug).eq('status','published').maybeSingle();if(error||!data){publicError('Esta tarjeta no está disponible.');return}state.publicCard=await resolveCardSocials(await resolveCardMedia(cardFromRow(data)));document.getElementById('root').innerHTML=`<div class="public-shell"><div class="public-content"><div class="phone" style="width:390px;max-width:100%;margin:auto">${phonePreview(state.publicCard).replace('<div class="phone">','').replace(/<\/div>$/,'')}</div>${state.publicCard.capture?prospectForm(state.publicCard):''}<p class="public-note">Digital Card</p></div></div>`;finishRender();void trackPublicView(state.publicCard)}
  function publicError(message){document.getElementById('root').innerHTML=`<div class="public-shell"><div class="panel" style="text-align:center"><h1>Digital Card</h1><p>${esc(message)}</p></div></div>`;finishRender()}
  db.auth.onAuthStateChange((event,session)=>{if(isPublicRoute())return;state.session=session;if(event==='PASSWORD_RECOVERY'){passwordRecoveryActive=true;cleanAuthCallbackUrl();render();return}if(passwordRecoveryActive)return;if(session)loadCards();else render()});
