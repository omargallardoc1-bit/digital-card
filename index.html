let language=localStorage.getItem(LANGUAGE_KEY)||((navigator.language||'es').toLowerCase().startsWith('en')?'en':'es');
if(!messages[language])language='es';
function t(key,values={}){let text=messages[language][key]??messages.es[key]??key;for(const [name,value] of Object.entries(values))text=text.replaceAll(`{${name}}`,value);return text}
function languageSwitcher(){return `<div class="language-control" role="group" aria-label="Language / Idioma"><button class="${language==='es'?'selected':''}" onclick="setLanguage('es')" aria-pressed="${language==='es'}">ES</button><button class="${language==='en'?'selected':''}" onclick="setLanguage('en')" aria-pressed="${language==='en'}">EN</button></div>`}
function setLanguage(next){if(!messages[next])return;language=next;localStorage.setItem(LANGUAGE_KEY,next);document.documentElement.lang=next;render()}

const INVITE_SESSION_KEY = 'mxbc_invitation_session';
const INVITE_LOCAL_KEY = 'mxbc_invitation_temporary';
const INVITE_TOKEN_PATTERN = /^[A-Za-z0-9_-]{43}$/;
const INVITE_LOCAL_TTL_MS = 30 * 60 * 1000;
const inviteState={active:false,token:null,session:null,mode:'login',busy:false,message:'',messageType:'info',accepted:false};

function inviteRecord(token){return JSON.stringify({token,expiresAt:Date.now()+INVITE_LOCAL_TTL_MS})}
function saveInviteToken(token){const record=inviteRecord(token);sessionStorage.setItem(INVITE_SESSION_KEY,record);localStorage.setItem(INVITE_LOCAL_KEY,record)}
function clearInviteToken(){sessionStorage.removeItem(INVITE_SESSION_KEY);localStorage.removeItem(INVITE_LOCAL_KEY);inviteState.token=null}
function readStoredInviteToken(){
  for(const storage of [sessionStorage,localStorage]){
    const key=storage===sessionStorage?INVITE_SESSION_KEY:INVITE_LOCAL_KEY;
    try{
      const record=JSON.parse(storage.getItem(key)||'null');
      if(record&&INVITE_TOKEN_PATTERN.test(record.token)&&Number(record.expiresAt)>Date.now())return record.token;
      storage.removeItem(key);
    }catch{storage.removeItem(key)}
  }
  return null;
}
function removeInviteFromAddressBar(){history.replaceState(null,document.title,location.pathname+location.search)}
function captureInviteFromUrl(){
  const hash=location.hash;
  if(!hash.startsWith('#/invite'))return false;
  inviteState.active=true;
  const match=hash.match(/^#\/invite\?token=([A-Za-z0-9_-]{43})$/);
  removeInviteFromAddressBar();
  if(!match){clearInviteToken();inviteState.message='invalidLink';inviteState.messageType='error';return true}
  inviteState.token=match[1];saveInviteToken(match[1]);return true;
}
function inviteMessage(){return inviteState.message?`<div class="invite-notice ${inviteState.messageType}">${esc(t(inviteState.message))}</div>`:''}
function inviteAuthForm(){
  const login=inviteState.mode==='login';
  return `<div class="invite-tabs"><button class="${login?'selected':''}" onclick="setInviteMode('login')">${t('login')}</button><button class="${!login?'selected':''}" onclick="setInviteMode('register')">${t('register')}</button></div>${inviteMessage()}<form onsubmit="submitInviteAuth(event)"><div class="invite-field"><label>${t('email')}</label><input id="inviteEmail" type="email" maxlength="254" autocomplete="email" required></div><div class="invite-field"><label>${t('password')}</label><input id="invitePassword" type="password" minlength="8" maxlength="128" autocomplete="${login?'current-password':'new-password'}" required></div><div class="invite-actions"><button class="primary" type="submit" ${inviteState.busy?'disabled':''}>${inviteState.busy?t('processing'):login?t('login'):t('register')}</button><button class="ghost" type="button" onclick="cancelInvite()">${t('cancel')}</button></div></form>`;
}
function inviteScreen(){
  let content='';
  if(inviteState.accepted){content=`${inviteMessage()}<div class="invite-actions"><button class="primary" onclick="finishInvite()">${t('goPanel')}</button></div>`}
  else if(!inviteState.token){content=`${inviteMessage()}<div class="invite-actions"><button class="ghost" onclick="cancelInvite()">${t('backHome')}</button></div>`}
  else if(inviteState.session){const email=inviteState.session.user?.email||'';content=`<div class="invite-notice info">${t('signedAs')}</div><div class="invite-email">${esc(email)}</div>${inviteMessage()}<div class="invite-actions"><button class="primary" onclick="acceptInvite()" ${inviteState.busy?'disabled':''}>${inviteState.busy?t('accepting'):t('accept')}</button><button class="ghost" onclick="signOutInvite()">${t('otherAccount')}</button><button class="ghost" onclick="cancelInvite()">${t('cancel')}</button></div>`}
  else content=inviteAuthForm();
  return `<div class="invite-shell"><section class="invite-card" aria-labelledby="inviteTitle"><div class="invite-logo">MX</div><h1 id="inviteTitle">${t('inviteTitle')}</h1><p>${t('inviteIntro')} <b>${t('accept')}</b>.</p>${content}</section></div>`;
}
function setInviteMode(mode){inviteState.mode=mode==='register'?'register':'login';inviteState.message='';render()}
function authMessage(error){
  const message=String(error?.message||'').toLowerCase();
  if(message.includes('invalid login'))return 'badLogin';
  if(message.includes('already registered')||message.includes('already been registered'))return 'registered';
  if(message.includes('password'))return 'weakPassword';
  if(message.includes('rate'))return 'rateLimit';
  return 'accessFailed';
}
async function submitInviteAuth(event){
  event.preventDefault();if(inviteState.busy)return;
  const email=document.getElementById('inviteEmail').value.trim().toLowerCase();
  const password=document.getElementById('invitePassword').value;
  inviteState.busy=true;inviteState.message='';render();
  try{
    if(inviteState.mode==='register'){
      const {data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:'https://mxbusinesscard.com/'}});
      if(error)throw error;
      if(!data.session){inviteState.message='confirmEmail';inviteState.messageType='info'}
      else inviteState.session=data.session;
    }else{
      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error)throw error;inviteState.session=data.session;
    }
  }catch(error){inviteState.message=authMessage(error);inviteState.messageType='error'}
  finally{inviteState.busy=false;render()}
}
function acceptanceMessage(error){
  const mapped={'La invitación no es válida o ha expirado.':'invalidExpired','La invitación ya no puede aceptarse.':'cannotAccept','La invitación no es válida para esta cuenta.':'wrongAccount','La cuenta ya pertenece a la organización.':'alreadyMember','Autenticación requerida.':'authRequired'};
  return mapped[error?.message]||'acceptFailed';
}
async function acceptInvite(){
  if(inviteState.busy||!inviteState.token)return;
  inviteState.busy=true;inviteState.message='';render();
  const {error}=await supabaseClient.rpc('accept_organization_invitation',{invitation_token:inviteState.token});
  inviteState.busy=false;
  if(error){inviteState.message=acceptanceMessage(error);inviteState.messageType='error';render();return}
  clearInviteToken();inviteState.accepted=true;inviteState.message='accepted';inviteState.messageType='success';render();
}
async function signOutInvite(){await supabaseClient.auth.signOut();inviteState.session=null;inviteState.message='useInvitedEmail';inviteState.messageType='info';render()}
function cancelInvite(){clearInviteToken();inviteState.active=false;inviteState.accepted=false;inviteState.message='';state.page='dashboard';render()}
function finishInvite(){inviteState.active=false;inviteState.accepted=false;inviteState.message='';state.page='dashboard';render()}

const state={page:'dashboard',step:1,card:{id:'CARD-000001',name:'Víctor Piña',role:'CEO & Fundador',company:'P&M Group',slogan:'Transformamos estrategia, tecnología y talento en resultados para tu empresa.',about:'Impulsamos empresas con Marketing Digital, IA, generación de leads, Contact Center y estrategias comerciales.',phone:'+52 667 000 0000',wa:'526670000000',email:'contacto@pmgroup.mx',web:'https://example.com',location:'Ciudad de México',instagram:'https://instagram.com/',linkedin:'https://linkedin.com/',facebook:'https://facebook.com/',tiktok:'https://tiktok.com/',youtube:'https://youtube.com/',x:'https://x.com/',capture:true,services:[['Contact Center & BPO','Ventas y conversión de leads, atención al cliente y gestión omnicanal.'],['Marketing Digital','Campañas y estrategias para generar leads y acelerar crecimiento.'],['Inteligencia Artificial','Automatización, contenido y optimización de procesos.']]},leads:[{id:'LEAD-000001',name:'Juan Pérez',phone:'+52 667 123 4567',email:'juan@email.com',card:'Víctor Piña',date:'13/08/2026 16:25',source:'QR',action:'WhatsApp'}]};
const navItems=[['dashboard','⌂','dashboard'],['cards','▣','cards'],['leads','♙','leads'],['stats','⌁','stats'],['templates','▧','templates'],['qr','▦','qr'],['clients','♧','clients'],['plans','▤','plans'],['settings','⚙','settings'],['integrations','◈','integrations'],['help','?','help']];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function nav(){document.getElementById('nav').innerHTML=navItems.map(([k,i,l])=>`<button class="${state.page===k?'active':''}" onclick="go('${k}')">${i} <span>${t(l)}</span></button>`).join('')}
function go(p){state.page=p;render()}
function render(){document.documentElement.lang=language;document.getElementById('languageControl').innerHTML=languageSwitcher();const userName=document.querySelector('.user b');if(userName)userName.textContent=t('admin');const app=document.getElementById('appRoot');const inviteRoot=document.getElementById('inviteRoot');if(inviteState.active){app.classList.add('hidden');inviteRoot.innerHTML=inviteScreen();return}inviteRoot.innerHTML='';app.classList.remove('hidden');nav();const m=document.getElementById('main');if(state.page==='dashboard')m.innerHTML=dashboard();else if(state.page==='cards')m.innerHTML=cards();else if(state.page==='leads')m.innerHTML=leads();else if(state.page==='editor')m.innerHTML=editor();else if(state.page==='public')m.innerHTML=publicPage();else m.innerHTML=placeholder(state.page);}
function dashboard(){const activity=['newLead','qrVisit','waClick','newCardCreated','leadExported'];return `<div class="top"><div><h1>${t('welcome')}</h1><p>${t('summary')}</p></div><button class="primary" onclick="newCard()">＋ ${t('createCard')}</button></div><div class="grid5"><div class="stat"><small>${t('totalVisits')}</small><strong>12,458</strong><div class="up">↑ 18.6% ${t('vsMonth')}</div></div><div class="stat"><small>${t('capturedLeads')}</small><strong>1,248</strong><div class="up">↑ 24.3% ${t('vsMonth')}</div></div><div class="stat"><small>${t('whatsappClicks')}</small><strong>2,856</strong><div class="up">↑ 15.8%</div></div><div class="stat"><small>${t('calls')}</small><strong>1,025</strong><div class="up">↑ 12.1%</div></div><div class="stat"><small>${t('savedContacts')}</small><strong>845</strong><div class="up">↑ 10.4%</div></div></div><div class="two"><div class="panel"><h2>${t('performance')}</h2><div style="height:240px;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#f8f7ff);border-radius:10px;color:#6b5ce7;font-size:18px">📈 ${t('visits')} 12,458 · ${t('leads')} 1,248 · WhatsApp 2,856</div></div><div class="panel"><h2>${t('recentActivity')}</h2>${activity.map((key,i)=>`<div class="activity"><div class="dot">${['♙','▦','◉','＋','↓'][i]}</div><div><b>${t(key)}</b><small style="display:block;color:#7a8190">${t('minutesAgo',{n:i*17+5})}</small></div></div>`).join('')}</div></div><div class="panel cards"><h2>${t('cards')}</h2>${cardTable()}</div>`}
function cardTable(){return `<table class="table"><thead><tr><th>${t('card')}</th><th>${t('clientCompany')}</th><th>${t('package')}</th><th>${t('status')}</th><th>${t('visits')}</th><th>${t('leads')}</th><th></th></tr></thead><tbody><tr><td><b>${esc(state.card.name)}</b><small style="display:block;color:#735bf2">mxbusinesscard.com/${slug()}</small></td><td>${esc(state.card.company)}</td><td><span class="badge">${t('elite')}</span></td><td class="active">● ${t('active')}</td><td>248</td><td>${state.leads.length}</td><td><button class="ghost" onclick="editCard()">${t('edit')}</button></td></tr></tbody></table>`}
function cards(){return `<div class="top"><div><h1>${t('cards')}</h1><p>${t('manageCards')}</p></div><button class="primary" onclick="newCard()">＋ ${t('createNew')}</button></div><div class="panel">${cardTable()}</div>`}
function leads(){return `<div class="top"><div><h1>${t('leads')}</h1><p>${t('optionalContacts')}</p></div><button class="primary" onclick="exportCSV()">↓ ${t('exportCsv')}</button></div><div class="panel"><table class="table"><thead><tr><th>ID</th><th>${t('name')}</th><th>${t('phone')}</th><th>${t('email')}</th><th>${t('card')}</th><th>${t('date')}</th><th>${t('source')}</th><th>${t('action')}</th></tr></thead><tbody>${state.leads.map(l=>`<tr><td>${l.id}</td><td>${esc(l.name)}</td><td>${esc(l.phone)}</td><td>${esc(l.email)}</td><td>${esc(l.card)}</td><td>${l.date}</td><td>${esc(l.source)}</td><td>${esc(l.action)}</td></tr>`).join('')}</tbody></table></div>`}
function editor(){const c=state.card;const steps=['information','contact','networks','content','buttons','design','capture','publish'];return `<div class="top"><div><h1>${t('editCard')}</h1><p>${t('previewChanges')}</p></div><div><button class="ghost" onclick="publicCard()">${t('publicView')}</button> <button class="primary" onclick="saveCard()">${t('save')}</button></div></div><div class="editor"><div class="panel"><div class="steps">${steps.map((key,i)=>`<div class="step ${state.step===i+1?'current':''}" onclick="state.step=${i+1};render()"><b>${i+1}</b>${t(key)}</div>`).join('')}</div>${formStep()}</div><div class="previewWrap"><div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>${t('livePreview')}</b><button class="ghost" onclick="toast(t('templatesSoon'))">${t('changeTemplate')}</button></div>${phonePreview()}<div class="capture"><div class="switch"><b>${t('leadCapture')}</b><div class="toggle ${c.capture?'on':''}" onclick="state.card.capture=!state.card.capture;render()"></div></div><small>${t('captureHint')}</small></div></div></div></div>`}
function formStep(){
  const c=state.card;
  if(state.step===1)return `<div class="formgrid"><div class="field"><label>${t('names')}</label><input value="${esc(c.name)}" oninput="state.card.name=this.value;syncPreview()"></div><div class="field"><label>${t('jobTitle')}</label><input value="${esc(c.role)}" oninput="state.card.role=this.value;syncPreview()"></div><div class="field"><label>${t('company')}</label><input value="${esc(c.company)}" oninput="state.card.company=this.value;syncPreview()"></div><div class="field"><label>${t('slogan')}</label><input value="${esc(c.slogan)}" oninput="state.card.slogan=this.value;syncPreview()"></div><div class="field full"><label>${t('description')}</label><textarea oninput="state.card.about=this.value;syncPreview()">${esc(c.about)}</textarea></div></div>`;
  if(state.step===2)return `<div class="formgrid">${[['phone','phone'],['wa','WhatsApp'],['email','email'],['web','website'],['location','location']].map(([key,label])=>`<div class="field"><label>${messages[language][label]||label}</label><input value="${esc(c[key])}" oninput="state.card['${key}']=this.value;syncPreview()"></div>`).join('')}</div>`;
  if(state.step===3)return `<div class="formgrid">${[['instagram','Instagram'],['linkedin','LinkedIn'],['facebook','Facebook'],['tiktok','TikTok'],['youtube','YouTube'],['x','X']].map(([key,label])=>`<div class="field"><label>${label}</label><input value="${esc(c[key])}" oninput="state.card['${key}']=this.value;syncPreview()"></div>`).join('')}</div>`;
  if(state.step===4)return `<div><h3>${t('services')}</h3>${c.services.map((service,index)=>`<div class="field"><label>${index+1}. ${esc(service[0])}</label><textarea oninput="state.card.services[${index}][1]=this.value;syncPreview()">${esc(service[1])}</textarea></div>`).join('')}<button class="ghost" onclick="state.card.services.push([language==='en'?'New service':'Nuevo servicio',language==='en'?'Service description':'Descripción del servicio']);render()">＋ ${t('addService')}</button></div>`;
  if(state.step===5)return `<p>${t('selectButtons')}</p><label><input type="checkbox" checked> WhatsApp</label><br><label><input type="checkbox" checked> ${t('callNow')}</label><br><label><input type="checkbox" checked> ${t('email')}</label><br><label><input type="checkbox" checked> ${t('website')}</label><br><label><input type="checkbox" checked> ${t('location')}</label>`;
  if(state.step===6)return `<div class="formgrid"><div class="field"><label>${t('template')}</label><select><option>${t('elegant')}</option><option>${t('professional')}</option><option>${t('minimalist')}</option></select></div><div class="field"><label>${t('mainColor')}</label><input type="color" value="#5b3df5"></div><div class="field full"><label>${t('coverImage')}</label><input type="file" accept="image/*" onchange="toast(t('uploadReady'))"></div></div>`;
  if(state.step===7)return `<div class="capture"><b>${t('optionalCapture')}</b><p>${t('requiredFields')}</p><label><input type="checkbox" ${c.capture?'checked':''} onchange="state.card.capture=this.checked;render()"> ${t('enableCapture')}</label></div>`;
  return `<div style="text-align:center;padding:30px"><h2>${t('readyPublish')}</h2><p>${t('permanentUrl')} <b>mxbusinesscard.com/${slug()}</b></p><p>${t('qrPermanent')}</p><button class="primary" onclick="publicCard()">🚀 ${t('publishCard')}</button></div>`;
}
function slug(){return cslug(state.card.name)}function cslug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'mi-card'}
function phonePreview(){const c=state.card;return `<div class="phone"><div class="screen"><div class="hero"><div class="avatar">${esc(c.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><h2>${esc(c.name)}</h2><p>${esc(c.role)}</p><p style="opacity:.8">${esc(c.company)}</p><small>${esc(c.slogan)}</small></div><div class="mini"><div class="social"><span>in</span><span>◎</span><span>f</span><span>▶</span><span>♪</span></div><button class="action wa">WhatsApp</button><button class="action">${t('callNow')}</button><button class="action">${t('sendEmail')}</button><button class="action">${t('visitWebsite')}</button><div class="section"><b>${t('about')}</b><p style="font-size:13px;color:#667085">${esc(c.about)}</p></div><div class="section"><b>${t('services')}</b>${c.services.slice(0,3).map(s=>`<div class="service"><b>${esc(s[0])}</b><div style="font-size:12px;color:#667085">${esc(s[1])}</div></div>`).join('')}</div></div></div></div>`}
function syncPreview(){const p=document.querySelector('.previewWrap .panel');if(p){const cap=state.card.capture;p.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>${t('livePreview')}</b><button class="ghost" onclick="toast(t('templatesSoon'))">${t('changeTemplate')}</button></div>${phonePreview()}<div class="capture"><div class="switch"><b>${t('leadCapture')}</b><div class="toggle ${cap?'on':''}" onclick="state.card.capture=!state.card.capture;render()"></div></div><small>${t('captureHint')}</small></div>`}}
function newCard(){const english=language==='en';state.card={...state.card,id:'CARD-'+String(Date.now()).slice(-6),name:english?'New person':'Nueva persona',role:english?'Professional':'Profesional',company:english?'New company':'Nueva empresa',slogan:english?'Your brand. Your connection.':'Tu marca. Tu conexión.',about:english?'Write your business introduction here.':'Escribe aquí la presentación de tu negocio.',phone:'',wa:'',email:'',web:'',location:'',instagram:'',linkedin:'',facebook:'',tiktok:'',youtube:'',x:'',capture:true,services:[[english?'Service 1':'Servicio 1',english?'Describe your service.':'Describe tu servicio.']]};state.step=1;state.page='editor';render()}
function editCard(){state.step=1;state.page='editor';render()}function saveCard(){localStorage.setItem('digitalCardMVP',JSON.stringify(state));toast(t('saved'))}function publicCard(){localStorage.setItem('digitalCardMVP',JSON.stringify(state));state.page='public';render()}function exportCSV(){const rows=[['ID',t('name'),t('phone'),t('email'),t('card'),t('date'),t('source'),t('action')],...state.leads.map(x=>[x.id,x.name,x.phone,x.email,x.card,x.date,x.source,x.action])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='mx-business-card-leads.csv';a.click()}
function publicPage(){return `<div class="top"><div><h1>${t('publicCard')}</h1><p>${t('visitorView')}</p></div><button class="primary" onclick="editCard()">← ${t('backEditor')}</button></div><div style="max-width:430px;margin:auto">${phonePreview()}<div class="panel" style="margin-top:15px"><h2>${t('optional')}</h2><p>${t('leaveData')}</p><button class="primary" onclick="showLead()">${t('testCapture')}</button></div></div>`}function showLead(){const name=prompt(t('name'));if(!name)return;const phone=prompt('WhatsApp / '+t('phone').toLowerCase());if(!phone)return;const email=prompt(t('optionalEmail'))||'';state.leads.push({id:'LEAD-'+String(state.leads.length+1).padStart(6,'0'),name,phone,email,card:state.card.name,date:new Date().toLocaleString(language==='en'?'en-US':'es-MX'),source:language==='en'?'Link':'Enlace',action:language==='en'?'View':'Vista'});toast(t('thanks'))}function placeholder(p){const key=navItems.find(x=>x[0]===p)?.[2];return `<div class="top"><div><h1>${key?t(key):t('module')}</h1><p>${t('nextPhase')}</p></div></div><div class="panel" style="padding:50px;text-align:center">🚧 <h2>${t('underConstruction')}</h2><p>${t('architectureReady')}</p></div>`}
async function initializeApp(){
  const cameFromInvite=captureInviteFromUrl();
  if(!cameFromInvite){const storedToken=readStoredInviteToken();if(storedToken){inviteState.token=storedToken;inviteState.active=true}}
  const {data}=await supabaseClient.auth.getSession();
  inviteState.session=data.session;
  supabaseClient.auth.onAuthStateChange((_event,session)=>{inviteState.session=session;if(inviteState.active)render()});
  render();
}
initializeApp();
</script>
