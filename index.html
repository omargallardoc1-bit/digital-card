  async function loadProspects(){if(!state.session)return;if(!state.organization)await loadOrganizationContext();if(!canViewOrganizationProspectPii()){state.prospects=[];state.prospectsTotal=0;state.prospectsLoading=false;render();return}if(!state.organization?.id){state.prospects=[];state.prospectsTotal=0;toast('No se encontró una organización activa.');render();return}state.prospectsLoading=true;render();const {data,error}=await db.rpc('list_organization_prospects',{target_organization_id:state.organization.id,target_card_id:state.prospectsCard==='all'?null:state.prospectsCard,requested_page:state.prospectsPage,requested_page_size:Math.min(state.prospectsPageSize,100),sort_direction:state.prospectsSort});if(error){state.prospects=[];state.prospectsTotal=0;state.prospectsLoading=false;toast('No se pudieron cargar los prospectos: '+error.message);render();return}const result=Array.isArray(data)?data[0]:data;state.prospects=Array.isArray(result?.items)?result.items:[];state.prospectsTotal=Number(result?.total_count||0);state.prospectsPage=Number(result?.page_number||1);state.prospectsPageSize=Math.min(Number(result?.page_size||50),100);state.prospectsLoading=false;render()}
  function prospectsView(){if(!canViewOrganizationProspectPii())return '<div class="top"><div><h1>Prospectos</h1><p>Tu rol no incluye acceso a datos personales de prospectos.</p></div></div><div class="panel empty">Los prospectos están disponibles para owner, admin y editor.</div>';const pages=Math.max(1,Math.ceil(state.prospectsTotal/state.prospectsPageSize));return `<div class="top"><div><h1>Prospectos</h1><p>Contactos capturados desde tus tarjetas públicas.</p></div><button class="primary" onclick="exportProspectsCsv()" ${state.prospectsTotal&&!state.prospectsLoading?'':'disabled'}>Exportar CSV</button></div><div class="panel"><div class="filters"><div class="field"><label for="prospects-card">Tarjeta</label><select id="prospects-card" onchange="setProspectsCard(this.value)"><option value="all">Todas las tarjetas</option>${state.organizationCards.map(card=>`<option value="${esc(card.id)}" ${state.prospectsCard===card.id?'selected':''}>${esc(card.name)}</option>`).join('')}</select></div><div class="field"><label for="prospects-sort">Orden</label><select id="prospects-sort" onchange="setProspectsSort(this.value)"><option value="desc" ${state.prospectsSort==='desc'?'selected':''}>Más recientes</option><option value="asc" ${state.prospectsSort==='asc'?'selected':''}>Más antiguos</option></select></div><div class="field"><label for="prospects-page-size">Filas</label><select id="prospects-page-size" onchange="setProspectsPageSize(this.value)"><option value="25" ${state.prospectsPageSize===25?'selected':''}>25</option><option value="50" ${state.prospectsPageSize===50?'selected':''}>50</option><option value="100" ${state.prospectsPageSize===100?'selected':''}>100</option></select></div></div><div class="table-wrap">${state.prospectsLoading?'<div class="empty">Cargando prospectos…</div>':prospectsTable()}</div><div class="top prospects-pagination" style="margin:16px 0 0"><p>Página ${esc(state.prospectsPage)} de ${esc(pages)} · ${esc(state.prospectsTotal)} prospectos</p><div><button class="ghost" onclick="changeProspectsPage(-1)" ${state.prospectsPage<=1||state.prospectsLoading?'disabled':''}>Anterior</button> <button class="ghost" onclick="changeProspectsPage(1)" ${state.prospectsPage>=pages||state.prospectsLoading?'disabled':''}>Siguiente</button></div></div></div>`}
  function prospectsTable(){if(!state.prospects.length)return `<div class="empty">Aún no hay prospectos para tus Digital Cards.</div>`;const rows=state.prospects.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(p.email||'—')}</td><td>${esc(p.card_name||'—')}</td><td>${esc(formatDate(p.created_at))}</td><td>${esc(p.source)}</td><td>${p.consent_given?`Sí · ${esc(p.consent_version||'—')}`:'No'}</td></tr>`).join(''),cards=state.prospects.map(p=>`<article class="admin-mobile-card"><header class="admin-mobile-card-header"><div class="admin-mobile-card-title"><strong>${esc(p.name)}</strong><small>${esc(p.card_name||'Tarjeta no disponible')}</small></div><span class="badge ${p.consent_given?'active':'archived'}">${p.consent_given?'Consentimiento':'Sin consentimiento'}</span></header><div class="admin-mobile-details"><div class="admin-mobile-detail"><span>Teléfono</span><strong>${esc(p.phone)}</strong></div><div class="admin-mobile-detail"><span>Correo</span><strong>${esc(p.email||'—')}</strong></div><div class="admin-mobile-detail"><span>Origen</span><strong>${esc(p.source)}</strong></div><div class="admin-mobile-detail"><span>Fecha</span><strong>${esc(formatDate(p.created_at))}</strong></div></div></article>`).join('');return `<div class="admin-desktop-table"><table class="table"><thead><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Tarjeta</th><th>Fecha</th><th>Origen</th><th>Consentimiento</th></tr></thead><tbody>${rows}</tbody></table></div><div class="admin-mobile-list" aria-label="Prospectos de la organización">${cards}</div>`}
  async function setProspectsCard(value){if(value!=='all'&&!state.organizationCards.some(card=>card.id===value))return;state.prospectsCard=value;state.prospectsPage=1;await loadProspects()}
  async function setProspectsSort(value){if(!['asc','desc'].includes(value))return;state.prospectsSort=value;state.prospectsPage=1;await loadProspects()}
  async function setProspectsPageSize(value){const size=Math.min(Math.max(Number(value)||50,1),100);state.prospectsPageSize=size;state.prospectsPage=1;await loadProspects()}
  async function changeProspectsPage(delta){const next=state.prospectsPage+delta,pages=Math.max(1,Math.ceil(state.prospectsTotal/state.prospectsPageSize));if(next<1||next>pages)return;state.prospectsPage=next;await loadProspects()}
  function formatDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'—':date.toLocaleString(language==='en'?'en-US':'es-MX')}
  function csvCell(value){let text=String(value??'');if(/^[=+\-@]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'}
  async function exportProspectsCsv(){if(!canViewOrganizationProspectPii()||!state.session||!state.organization?.id)return;const response=await fetch(SUPABASE_URL+'/functions/v1/export-prospects-csv',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+state.session.access_token},body:JSON.stringify({organization_id:state.organization.id,card_id:state.prospectsCard==='all'?null:state.prospectsCard,sort_direction:state.prospectsSort})});if(!response.ok){let message='No se pudo exportar el CSV.';try{const detail=await response.json();if(detail?.error)message=detail.error}catch{}toast(message);return}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='prospectos.csv';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)}
  async function login(event){event.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await db.auth.signInWithPassword({email,password});if(error){document.getElementById('login-error').textContent=authMessage(error);return}state.session=data.session;await loadCards()}
  async function logout(){mobileMoreOpen=false;clearPendingMedia();await db.auth.signOut();state.session=null;state.cards=[];state.prospects=[];state.prospectsPage=1;state.prospectsTotal=0;state.metrics=emptyMetrics();state.metricsAppliedDays=null;state.metricsError='';state.card=blankCard();state.cardSavedSnapshot='';state.statusMutationPending=false;state.cardButtons=[];state.cardButtonsLoading=false;state.cardButtonSubmittingId=null;state.cardServices=[];state.cardServicesLoading=false;state.cardServiceSubmittingId=null;state.organization=null;state.organizationMembership=null;state.organizationCards=[];state.subscription=null;state.plan=null;state.organizationUsage={cards:0,members:0};state.teamMembers=[];state.teamActiveCount=0;state.teamMaxMembers=null;state.teamCommercialStatus='no_subscription';state.teamCallerRole='';state.teamCanManage=false;state.teamLoading=false;state.teamSubmitting=false;state.teamActionUserId=null;state.teamError='';state.teamStale=false;state.qrCapabilities=emptyQrCapabilities();state.qrCapabilitiesLoading=false;state.qrCapabilitiesError='';state.qrDrafts={};state.qrRenderErrors={};render()}
  function editableCardRpcArgs(payload){return {card_name:payload.name,card_position:payload.position,card_company:payload.company,card_slogan:payload.slogan,card_description:payload.description,card_phone:payload.phone,card_whatsapp:payload.whatsapp,card_email:payload.email,card_website:payload.website,card_location:payload.location,card_capture_enabled:payload.capture_enabled,card_secondary_phone:payload.secondary_phone}}
  function cardRpcMessage(error,action){const message=String(error?.message||'').trim();if(!message)return `No se pudo ${action}.`;if(/máximo de Digital Cards/i.test(message))return 'La organización alcanzó el límite de Digital Cards de su plan.';if(/suscripción utilizable/i.test(message))return 'La organización no tiene una suscripción utilizable.';if(/pago pendiente|past_due/i.test(message))return 'La suscripción tiene un pago pendiente y esta operación no está disponible.';if(/permiso/i.test(message))return 'No tienes permisos para realizar esta operación.';if(/organización no está activa/i.test(message))return 'La organización no está activa.';return `No se pudo ${action}: ${message}`}
  async function refreshCardAndOrganization(cardId){if(!state.organization)await loadOrganizationContext();if(!state.organization?.id){toast('No se encontró una organización activa.');return null}const {data,error}=await db.from('digital_cards').select('*').eq('id',cardId).eq('organization_id',state.organization.id).single();if(error){toast('No se pudo recargar la tarjeta: '+error.message);return null}state.card={...await resolveCardSocials(await resolveCardMedia(cardFromRow(data))),buttons:state.cardButtons,services:state.cardServices};rememberCardDraft();await loadCards();await loadOrganizationContext();return data}
  async function saveCard(){if(!state.session||!canEditCurrentCardContent())return false;const wasNew=!state.card.id,payload=cardPayload();if(!payload.slug){toast('Indica un nombre para generar la URL.');return false}let response;if(state.card.id){if(!state.card.organization_id){toast('Esta tarjeta no está asignada a una organización y requiere migración administrativa.');return false}response=await db.rpc('update_organization_card',{target_card_id:state.card.id,...editableCardRpcArgs(payload)})}else{if(!state.organization)await loadOrganizationContext();if(!state.organization?.id){toast('No se encontró una organización activa para crear la tarjeta.');return false}response=await db.rpc('create_organization_card',{target_organization_id:state.organization.id,card_slug:payload.slug,...editableCardRpcArgs(payload)})}if(response.error){toast(cardRpcMessage(response.error,wasNew?'crear la tarjeta':'guardar la tarjeta'));return false}const responseRow=Array.isArray(response.data)?response.data[0]:response.data;if(!responseRow?.id){toast('La operación no devolvió una tarjeta válida.');return false}if(!await saveCardSocials(responseRow.id,state.card.socials))return false;const confirmed=await refreshCardAndOrganization(responseRow.id);if(!confirmed)return false;const verificationFields=['name','position','company','slogan','description','phone','secondary_phone','whatsapp','email','website','location','capture_enabled'];if(wasNew)verificationFields.unshift('slug');const mismatch=verificationFields.find(key=>(confirmed[key]??null)!==(payload[key]??null));if(mismatch){const message=`La verificación no coincide en ${mismatch}: esperado ${payload[mismatch]??null}, recibido ${confirmed[mismatch]??null}`;toast(message);return false}toast(language==='en'?'Digital Card saved successfully.':'Digital Card guardada correctamente.');render();return true}
  async function resolveUnsavedCardChanges(cardId){if(!hasUnsavedCardChanges())return true;if(confirm('Hay cambios sin guardar. ¿Deseas guardarlos antes de cambiar el estado?'))return await saveCard();if(!confirm('¿Descartar los cambios sin guardar y continuar?'))return false;return !!await refreshCardAndOrganization(cardId)}
  async function setCardStatus(cardId,status){if(!state.session||!cardId||!canEditOrganizationContent()||state.statusMutationPending)return false;const card=state.card.id===cardId?state.card:state.cards.find(item=>item.id===cardId),transitions={draft:['published','archived'],published:['draft','archived'],archived:['draft']};if(!card||!Object.hasOwn(transitions,card.status)||!transitions[card.status].includes(status)){toast(cardStatusLabel(card?.status));return false}if(!card.organization_id){toast('Esta tarjeta no está asignada a una organización y requiere migración administrativa.');return false}state.statusMutationPending=true;render();try{if(!await resolveUnsavedCardChanges(cardId))return false;if(status==='archived'&&!confirm('¿Archivar esta Digital Card? Dejará de estar disponible públicamente.'))return false;if(card.status==='published'&&status==='draft'&&!confirm('¿Volver a borrador? La URL pública dejará de estar disponible.'))return false;if(card.status==='archived'&&status==='draft'&&!confirm('¿Reactivar como borrador? La tarjeta volverá a consumir capacidad del plan.'))return false;const response=await db.rpc('set_card_status',{target_card_id:cardId,target_status:status});if(response.error){toast(String(response.error.message||'No se pudo cambiar el estado de la tarjeta.'));return false}const confirmed=await refreshCardAndOrganization(cardId);if(!confirmed)return false;const messages={published:'Digital Card publicada.',draft:card.status==='archived'?'Digital Card reactivada como borrador.':'Digital Card convertida en borrador.',archived:'Digital Card archivada.'};toast(messages[status]);return true}finally{state.statusMutationPending=false;render()}}
  async function publishCard(){return setCardStatus(state.card.id,'published')}
  function publicCard(){if(state.card.status==='published')location.assign('/c/'+encodeURIComponent(state.card.slug));}
  function prospectSessionKey(cardId){return 'prospect-sent:'+cardId}
  function prospectAlreadySent(cardId){try{return sessionStorage.getItem(prospectSessionKey(cardId))==='1'}catch{return false}}
  function publicEventSource(){return new URLSearchParams(location.search).get('source')==='qr'?'qr':'public_card'}
  function cardViewSessionKey(cardId,source){return 'card-viewed:'+cardId+':'+source}
  function clickSessionKey(cardId,eventType){return 'card-click:'+cardId+':'+eventType}
  function sendCardEvent(eventType){if(!state.publicCard)return Promise.resolve(null);return fetch(SUPABASE_URL+'/functions/v1/track-card-event',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({card_id:state.publicCard.id,event_type:eventType,metadata:{source:publicEventSource()}}),keepalive:true})}
  async function trackPublicView(card){try{const source=publicEventSource(),key=cardViewSessionKey(card.id,source);if(sessionStorage.getItem(key)==='1')return;const response=await sendCardEvent('view');if(response?.ok)sessionStorage.setItem(key,'1')}catch{}}
  function trackPublicClick(eventType){if(!state.publicCard)return;try{const key=clickSessionKey(state.publicCard.id,eventType),now=Date.now(),last=Number(sessionStorage.getItem(key)||0);if(now-last<1500)return;sessionStorage.setItem(key,String(now))}catch{}void sendCardEvent(eventType).catch(()=>{})}
  function prospectForm(card){if(prospectAlreadySent(card.id))return `<div class="panel lead-panel success" role="status"><b>Datos enviados correctamente.</b><br>Gracias por compartir tu información.</div>`;return `<div class="panel lead-panel" id="prospect-panel"><h2>¿Quieres que te contactemos?</h2><p class="copy-muted">Déjanos tus datos de forma opcional. La tarjeta y sus medios de contacto permanecen disponibles sin completar este formulario.</p><form onsubmit="submitProspect(event)" aria-describedby="prospect-consent-help prospect-form-error"><div class="field"><label for="prospect-name">Nombre</label><input id="prospect-name" name="name" maxlength="120" autocomplete="name" required></div><div class="field"><label for="prospect-phone">Teléfono</label><input id="prospect-phone" name="phone" type="tel" maxlength="40" autocomplete="tel" required></div><div class="field"><label for="prospect-email">Correo (opcional)</label><input id="prospect-email" name="email" type="email" maxlength="254" autocomplete="email"></div><div class="field check"><label for="prospect-consent"><input id="prospect-consent" name="consentimiento" type="checkbox" required><span class="consent" id="prospect-consent-help">Acepto que mis datos sean utilizados para que el titular de esta Digital Card me contacte en relación con sus productos o servicios. Puedo decidir no enviar este formulario y seguir usando la tarjeta.</span></label></div><div class="error" id="prospect-form-error" data-prospect-error role="alert" aria-live="polite"></div><button class="primary" type="submit">Enviar mis datos</button></form></div>`}
  async function submitProspect(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),errorEl=form.querySelector('[data-prospect-error]');if(!state.publicCard||prospectAlreadySent(state.publicCard.id))return;errorEl.textContent='';button.disabled=true;button.textContent='Enviando…';const values=new FormData(form);const payload={card_id:state.publicCard.id,name:String(values.get('name')??'').trim(),phone:String(values.get('phone')??'').trim(),email:String(values.get('email')??'').trim(),source:publicEventSource(),consentimiento:values.get('consentimiento')==='on'};const {error}=await db.functions.invoke('create-prospect',{body:payload});if(error){let message='No fue posible enviar tus datos. Inténtalo nuevamente.';try{const detail=await error.context.json();if(detail?.error)message=detail.error}catch{}errorEl.textContent=message;button.disabled=false;button.textContent='Enviar mis datos';return}try{sessionStorage.setItem(prospectSessionKey(state.publicCard.id),'1')}catch{}document.getElementById('prospect-panel').outerHTML=`<div class="panel lead-panel success"><b>Datos enviados correctamente.</b><br>Gracias por compartir tu información.</div>`}
  async function renderPublic(){const slug=decodeURIComponent(location.pathname.replace(/^\/c\/?/, '')).split('/')[0];document.getElementById('root').innerHTML='<div class="public-shell"><div class="panel">Cargando tarjeta…</div></div>';finishRender();if(!slug){publicError('Tarjeta no encontrada.');return}const {data,error}=await db.from('digital_cards').select('*').eq('slug',slug).eq('status','published').maybeSingle();if(error||!data){publicError('Esta tarjeta no está disponible.');return}const card=await resolveCardSocials(await resolveCardMedia(cardFromRow(data))),[buttonsResponse,servicesResponse]=await Promise.all([db.from('card_buttons').select('id,card_id,label,action_type,action_value,position,enabled').eq('card_id',card.id).eq('enabled',true).order('position',{ascending:true}).order('created_at',{ascending:true}),db.from('card_services').select('id,card_id,title,description,position').eq('card_id',card.id).order('position',{ascending:true}).order('created_at',{ascending:true})]);state.publicCard={...card,buttons:buttonsResponse.error?[]:buttonsResponse.data||[],services:servicesResponse.error?[]:servicesResponse.data||[]};document.getElementById('root').innerHTML=`<div class="public-shell"><div class="public-content"><div class="public-card">${phonePreview(state.publicCard).replace('<div class="phone">','').replace(/<\/div>$/,'')}</div>${state.publicCard.capture?prospectForm(state.publicCard):''}<p class="public-note">Digital Card</p></div></div>`;finishRender();void trackPublicView(state.publicCard)}
  function publicError(message){document.getElementById('root').innerHTML=`<div class="public-shell"><div class="panel centered-panel" role="alert"><h1>Digital Card</h1><p>${esc(message)}</p></div></div>`;finishRender()}
  db.auth.onAuthStateChange((event,session)=>{if(isPublicRoute())return;state.session=session;if(event==='PASSWORD_RECOVERY'){passwordRecoveryActive=true;cleanAuthCallbackUrl();render();return}if(passwordRecoveryActive)return;if(session)loadCards();else render()});
  (async()=>{if(!isPublicRoute())inviteTokenFromUrl();if(isPublicRoute()){renderPublic();return}const {data:{session}}=await db.auth.getSession();state.session=session;if(passwordRecoveryActive){render();return}if(session)await loadCards();else render()})();
